    BranchTreeMixedRevision:
      value:
        asOf: '2026-04-05T17:22:03.518Z'
        rootRevisionId: a0Ag8000000Ab01EAC
        sourceTimePoint: '2026-01-15T00:00:00.000Z'
        rows: []
        warnings:
          - warningCode: MIXED_REVISION
            message: 'This item appears at more than one revision in the same tree, because inherited rows are pinned to the source timepoint while claimed and local rows follow the as-of date. This is expected and does not block anything.'
            itemId: a02g8000000Ab21EAC
            itemRevisionIds: [a0Ag8000000Ab31EAC, a0Ag8000000Ab32EAC]
            governingTimestamps: ['2026-01-15T00:00:00.000Z', '2026-04-05T17:22:03.518Z']

    SourceTree:
      value:
        asOf: '2026-04-05T17:22:03.518Z'
        rootRevisionId: a0Ag8000000Ab01EAC
        sourceTimePoint: '2026-01-15T00:00:00.000Z'
        rows:
          - edgeId: null
            edgeKey: a0Bg8000000Ab10EAC
            parentItemId: a02g8000000Ab01EAC
            childItemId: a02g8000000Ab20EAC
            childItemRevisionId: a0Ag8000000Ab41EAC
            provenance: inherited
            governingTimestamp: '2026-01-15T00:00:00.000Z'
