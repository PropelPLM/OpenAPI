            isReplaced: false
            isEditable: true
            quantity: 3
            findNumber: 30
            childRows: []
          - edgeId: a1Eg8000000AbD9EAK
            edgeKey: 'local-a1Bg8000000AbCdEAK-a02g8000000Ab01EAC-a02g8000000Ab90EAC'
            parentItemId: a02g8000000Ab01EAC
            childItemId: a02g8000000Ab90EAC
            childItemRevisionId: a0Ag8000000Ab95EAC
