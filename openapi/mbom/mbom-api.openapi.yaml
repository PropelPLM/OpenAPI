        '400':
          description: '`INVALID_REQUEST` — `asOf` was supplied, or `limit` or `cursor` is unusable.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundPath' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mbom/branches/{branchId}/findings:
    get:
      tags: [Structure]
      operationId: getBranchFindings
      summary: Read every warning about a branch's configuration
      description: |
        Every warning the branch's resolution raises, over the **whole** configuration. A tree read
        reports only warnings about the rows it returns. This is where to look for conditions
        that no single page can see, and for the complete list of row warnings in one place.

        | warningCode | About | `rowKey` |
        |---|---|---|
        | `MIXED_REVISION` | an item rendered at more than one revision anywhere in the tree | null |
        | `STORED_REVISION_RETIRED` | a row whose stored revision was Cancelled or Expired | the row |
        | `MEMBER_ADD_COLLISION` | a position asserted by both the branch and its source | the collapsed row |
        | `PINNED_SUBTREE_HIDES_EDITS` | branch edits a pinned row's structure hides — one per pinned row and hidden item | the pinned row |
        | `NESTED_CYCLE_PRUNED` | a nested structure dropped because it reached a cycle | the row it hangs from |

        `MIXED_REVISION` findings come first, then the row warnings in tree order. Paged by `limit`
        (default 200) and `cursor`; an empty `findings` is the healthy answer.

        Like the [flattened view](#operation/getBranchFlattened), this is a whole-configuration
        output: `200` today, and possibly `202 Accepted` + `jobId` for a very large configuration
        in a later version.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of findings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Findings' }
              examples:
                mixedRevision:
                  summary: An item at two revisions, and a dead stored revision
                  $ref: '#/components/examples/BranchFindings'
        '400':
          description: '`ASOF_INVALID`, `ASOF_IN_FUTURE`, or `INVALID_REQUEST` for an unusable `limit` or `cursor`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundPath' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '422':
          description: '`EBOM_CYCLE` — the source eBOM contains a cycle.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mbom/baselines/{baselineId}/findings:
    get:
      tags: [Baselines]
      operationId: getBaselineFindings
      summary: Check a baseline for drift
      description: |
        Re-resolves the baseline and compares what it finds against the counts its cut recorded.
        Each mismatch is one finding. An empty `findings` means no drift was detected.

        | warningCode | What moved |
        |---|---|
        | `BASELINE_COUNT_DRIFT` | the baseline re-derived a **different number of rows** than its cut recorded |
        | `BASELINE_PROVENANCE_DRIFT` | a **different number of `claiming`** rows |
        | `BASELINE_PIN_DRIFT` | a **different number of rows holding a chosen revision** |

        The full meaning of each canary, and what none of them can see, is described on the
        [baseline tree read](#operation/getBaselineTree). A baseline is a record of a decision
        already taken, so the advice warnings a branch raises (`MIXED_REVISION` and the row
        warnings) are not reported here. `asOf` is refused (`400 INVALID_REQUEST`).
      parameters:
        - $ref: '#/components/parameters/BaselineId'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of findings — at most three.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Findings' }
              examples:
                clean:
                  summary: No drift
                  $ref: '#/components/examples/BaselineFindingsClean'
                countDrift:
                  summary: Count drift after a direct edit to an already-released eBOM
                  $ref: '#/components/examples/BaselineFindingsDrift'
                pinDrift:
                  summary: BASELINE_PIN_DRIFT
                  $ref: '#/components/examples/BaselineFindingsPinDrift'
        '400':
          description: '`INVALID_REQUEST` — `asOf` was supplied, or `limit` or `cursor` is unusable.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundPath' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================================================================== editing

  /mbom/branches/{branchId}/deltas:
    post:
      tags: [Editing]
      operationId: applyDeltaBatch
      summary: Apply a batch of delta operations to a branch
      description: |
        The single write endpoint for editing a branch. Eight operations — `claim`, `update`, `add`,
        `exclude`, `restore`, `replace`, `revert`, `convert-to-native` — arrive in one array and are
        applied under one envelope. There is no `set-revision` operation: `update` is the one row
        edit, and changes or clears a stored child revision too. `"op": "set-revision"`
        answers `INVALID_REQUEST` (`unknown op set-revision`), like any unknown op.

        **Returns `200`, not `201`**, even though rows are created: the response is a *report* on a
        set of operations, not a pointer to one new resource, and under `atomic: false` some of them
        may have failed.

        ## How a batch executes

        1. **Size check** — more than 200 operations is `BATCH_TOO_LARGE` (413), refused before
           anything is resolved.
        2. **One snapshot.** The branch is resolved **once**, at `asOf`. That is the whole reason a
           batch endpoint exists: twenty operations resolving the branch each would be twenty
           traversals, and the tree could shift underneath the batch halfway through.
        3. **Validate everything, then apply.** Two passes, never interleaved, so *every* fault is
           reported rather than only the first.
        4. **Persist** in a fixed number of database writes — twenty claims cost the same writes as
           one.

        ### Order is preserved, but order is not sequencing

        Results come back in request order with your `clientRef` echoed and `index` stated. But
        **every operation validates against the one pre-batch snapshot, so a later operation cannot
        see an earlier one's effect.** `[claim(L), update(L)]` in one batch answers `CLAIM_REQUIRED`
        on the update — and under the default `atomic: true` that rejects the whole batch.

        > **Dependent edits are two requests, not two operations.**

        > The most common dependent pair, claim then change a quantity, is **one** operation:
        > `{"op": "update", "ebomAssemblyId": "…", "quantity": 3, "autoClaim": true, "trackChildRevision": true}`.
        > The batch still does not sequence, so `[claim(L), update(L)]` still answers
        > `CLAIM_REQUIRED`. Send that payload only to a row you know is `base`: on a row the branch
        > already owns, `trackChildRevision: true` **clears** whatever revision the row stores
        > (see below).

        ### Two operations on one row in one batch

        Operations that fork or edit a row's current revision are mutually exclusive in one batch;
        a content edit followed by an operation that only appends a later delta is a coherent
        sequence, and both apply. The second of a refused pair answers `INVALID_REQUEST`.

        - Every `update` that writes takes the row's **revise slot**: a second `update` of the row
          is refused (`already revised earlier in this same batch`). So is a `convert-to-native`
          that stamps a revision different from the stored one (it forks), beside an `update`, in
          either order.
        - An `update` that **changes the stored revision**, or that claims (`autoClaim`), also takes
          the row's **membership slot**: beside a `claim`, `revert`, `exclude`, `restore`,
          `replace`, any `convert-to-native` or another such `update` of the same row, the second
          is refused (`that row already has a membership change earlier in this same batch`).
        - Still allowed: a quantity / find-number-only `update` beside `revert`, `exclude`, or a
          `convert-to-native` that keeps the stored revision.
        - A revision-only `update` the row already satisfies writes nothing and takes no slot.

        ## `atomic` — the failure contract is yours to choose

        | `atomic` | Behaviour |
        |---|---|
        | `true` (**default** — a null wins the safer contract) | All-or-nothing. Any validation failure throws: the status is the **first failure's** own code (so a batch whose only fault is `CLAIM_REQUIRED` still answers 409, not a generic 400) and the body carries a `failures[]` array with **every** failure. The branch is left exactly as it was. |
        | `false` | Apply what is valid, report the rest. `200` with per-operation `results[]`. |

        `atomic: false` reports per-operation **validation** failures only. It does not fall back to
        saving operation by operation: the valid operations are saved together, and a failure while
        saving rolls the whole batch back and is returned as an error.

        ## `asOf` chooses what a batch *validates* against; it never dates the write

        Every row written is effective **now**, whatever `asOf` says. A past `asOf` means "validate
        against the configuration as it stood then" — optimistic concurrency, not time travel.
        Backdating the write would let a batch win the current state *and* change what a read at an
        intervening timestamp returned, rewriting history in an append-only log.

        Several operations therefore **refuse a past `asOf` outright** with `INVALID_REQUEST`,
        because they decide from the branch's *current* state: `restore`, `revert`,
        `convert-to-native`, and any `claim` / `add` / `exclude` / `replace` that has to mint a new
        edge identity.

        ## Last write wins

        An operation does not check whether someone else changed its row since the caller read
        it. An edit of a row another user changed in the meantime applies over their change, and
        the last write wins. There is no row-level or branch-wide precondition to send. MBOM
        editing is not a high-concurrency workload, so this keeps the contract simple.

        Every write but one keeps the state it replaced in the branch's history. `claim`,
        `exclude`, `restore`, `revert`, `convert-to-native` and `replace` append to the branch's
        delta log, and an `update` that forks creates a new revision beside the old one. The
        exception is an `update` that edits a Draft revision in place (`forked: false`): it
        rewrites that revision and keeps no copy of the value it replaced.

        ## After the write: `snapshot` and `invalidatedParentRowKeys`

        A successful response carries the `snapshot` of the branch **after** the write, and
        `invalidatedParentRowKeys`: the rows whose children a client should fetch again, because a
        row beneath them was added, removed or changed. An empty string in the list stands for the
        root. Re-reading those rows' children with the new `snapshot` brings a grid up to date
        without reloading the whole tree.

        ## `Idempotency-Key`

        Read and passed through, and **ignored in this version**. It is accepted so a client can start
        sending it now without its first request failing, and a later version can honour it without a
        breaking change.

        ## The operations

        | `op` | Required fields | What it does |
        |---|---|---|
        | `claim` | `ebomAssemblyId`, and **exactly one of** `childItemRevisionId` \| `trackChildRevision: true` | Takes one live eBOM line into the branch as a copy-on-write claim, so the branch can diverge from it. Copies quantity and find number as they stand; the child revision is the caller's choice — a chosen revision **pins** it, `trackChildRevision: true` **tracks** the source line at T_R. Writes 5 records. |
        | `update` | `assemblyCiId` **or** `ebomAssemblyId`; **at least one of** `quantity`, `findNumber`, `childItemRevisionId`, `trackChildRevision: true`; optional `autoClaim` | Revises a branch-owned edge. Omitted fields keep the row's value. Without a revision change it edits the row's current revision in place while that is Draft (`forked: false`), otherwise allocates a new revision, freezes the old one, and returns `forked: true`. A `childItemRevisionId` different from the one the row **stores** pins it to that revision; `trackChildRevision: true` clears a stored revision. A revision change **always forks** (`forked: true`, even over a Draft). With `autoClaim: true` it also claims a `base` edge first (see `DeltaOperation.autoClaim`). |
        | `add` | `parentItemId`, `childItemId`, `quantity`, `findNumber`; optional `childItemRevisionId` | Adds a part the eBOM never supplied — packaging, fixtures, consumables. Provenance `new`. The child **floats** at `asOf`, unless `childItemRevisionId` pins it. |
        | `exclude` | `ebomAssemblyId` **or** `ciId` | Tombstones a row. **No cascade is written** — the descendant prune is computed at read time, because a descendant still supplied through another path must survive. |
        | `restore` | `ciId` | Lifts an exclusion. A row the branch holds its own content for renders that content again; a `base` row that was excluded without being claimed falls back to what its source supplies. |
        | `replace` | `replacedEbomAssemblyId`, `newChildItemId`, `quantity`, `findNumber`; optional `childItemRevisionId` | Substitutes a different child for the one an eBOM line supplies, **recording that it is a substitution**, so the pair does not read as an unrelated removal plus an unrelated addition. The substitute floats at `asOf` unless `childItemRevisionId` pins it. |
        | `revert` | `ciId` **or** `ebomAssemblyId` | Discards the branch's claim so the row falls back to what its source supplies. Nothing is deleted: the revert is recorded in the branch log, and the branch content for the row stops applying. |
        | `convert-to-native` | `ciId`, and **exactly one of** `childItemRevisionId` \| `trackChildRevision: true` | Severs a claiming edge's link to the source it claims: same quantity and find number, but now branch-owned in its own right (`provenance` flips `claiming` → `new`). The child revision is the caller's choice — a chosen revision is stamped on, `trackChildRevision: true` floats at `asOf`. |

        ### `update` in detail

        One `update` saves everything a line editor holds — quantity, find number and revision —
        in one operation and, when the revision changes, one fork. A pull's `accept-fields`
        decision compiles to exactly one `update` too.

        - **Omitted = keep**, for every field. A null `childItemRevisionId` alone is not a clear;
          clearing is spelled `trackChildRevision: true`. Sending none of `quantity`, `findNumber`,
          `childItemRevisionId`, `trackChildRevision: true` answers `INVALID_REQUEST`
          (`update requires quantity, findNumber, childItemRevisionId or trackChildRevision: true`).
        - **A revision change** is a requested stored value that differs from what the row
          **stores** — not what it renders. Pinning a tracking claim to the very revision it shows
          is a change ("follow" becomes "hold"). It always creates a new row revision, even over a
          Draft, carrying the request's quantity / find number or the row's own; `forked: true`.
        - **What a clear leaves.** A cleared claim becomes a tracking claim: it renders its source
          line's revision at T_R and moves only when a pull accepts a newer source. A cleared
          `new` row or substitute floats at `asOf`. Setting a pin that differs from the source
          line's revision starts rendering that revision's structure beneath the row; clearing it,
          or pinning the source line's revision, stops that, and any edits it hid render again.
        - **A revision-only request equal to the stored state** (the same pin, or a clear of a row
          storing nothing) succeeds and writes nothing; `forked` is null. A retry after a lost
          response therefore succeeds.
        - **A past `asOf`** is tolerated on an owned row unless the row has been revised since
          (`STALE_REVISION`).

        **`autoClaim: true`** lets an `update` of a `base` edge claim and revise in one operation
        instead of answering `CLAIM_REQUIRED`; the result says so with `claimed: true` and
        `forked: null`. Because it claims, it then needs **exactly one of**
        `childItemRevisionId` | `trackChildRevision: true` (the claim's revision choice) — but
        only when the row turns out to be `base`. On a row the branch already owns, the flag is a
        no-op (`claimed` null) and the revision fields mean what they mean on any `update`.

        Guards are checked in this order:

        1. `INVALID_REQUEST`: no id; nothing named; a quantity ≤ 0.
        2. `REVISION_CHOICE_REQUIRED`: both `childItemRevisionId` and `trackChildRevision: true`
           (any row, before the lookup).
        3. `NOT_FOUND`
        4. `NOT_EDITABLE`: a nested row.
        5. `CLAIM_REQUIRED`: a `base` row without `autoClaim`.
        6. For an `autoClaim` claim of a `base` row: `REVISION_CHOICE_REQUIRED` (neither choice),
           `INVALID_REQUEST` (a past `asOf`, as on `claim`), `REVISION_ITEM_MISMATCH`,
           `INVALID_REQUEST` (another operation in the batch already changed the row's
           membership).
        7. For an owned row: `NOT_SUPPLIED` (a tombstone), `STALE_REVISION` (a past `asOf`),
           `REVISION_ITEM_MISMATCH`, `INVALID_REQUEST` (the row was already revised — or, for a
           revision change, had its membership changed — earlier in the batch).

        ### Choosing a child revision

        A stored revision must always mean somebody chose it, so the operations that create or take
        over a row treat `childItemRevisionId` as a deliberate choice, never a default:

        | `op` | `childItemRevisionId` sent | `trackChildRevision: true` sent | Neither | Both |
        |---|---|---|---|---|
        | `claim` | **pins** the claimed row to it | row **tracks** the source line — the revision its unclaimed self would render, at T_R, moving when a pull accepts a newer source | `422 REVISION_CHOICE_REQUIRED` | `422 REVISION_CHOICE_REQUIRED` |
        | `convert-to-native` | **stamped** onto the native row | nothing stored; the native row **floats** at `asOf`, like an `add` | `422 REVISION_CHOICE_REQUIRED` | `422 REVISION_CHOICE_REQUIRED` |
        | `add`, `replace` | **pins** the new row / substitute | ignored — blank already means track | the row **floats** at `asOf` (the default) | pins; the flag is ignored |
        | `update` on an owned edge (with or without `autoClaim`) | **pins** it; a revision different from the stored one forks | **clears** the stored revision | keeps the stored revision | `422 REVISION_CHOICE_REQUIRED` |
        | `update` with `autoClaim: true`, on a `base` edge | claims and **pins** | claims and **tracks** | `422 REVISION_CHOICE_REQUIRED` | `422 REVISION_CHOICE_REQUIRED` |
        | `update` without `autoClaim`, on a `base` edge | `409 CLAIM_REQUIRED` | `409 CLAIM_REQUIRED` | `409 CLAIM_REQUIRED` | `422 REVISION_CHOICE_REQUIRED` |
        | every other op | ignored | ignored | — | — |

        - **There is no server-side "pin what I see".** To pin the revision the tree is showing, or
          to have a convert "keep what it shows", send back that row's own
          `detail.childItemRevisionId`. That includes converting a *pinned* claim that should stay
          pinned: nothing is retained implicitly.
        - **The revision must belong to the row's child item** — for `claim`, the claimed line's
          child; for `replace`, the substitute; for `convert-to-native`, the converted row's.
          Otherwise `422 REVISION_ITEM_MISMATCH`. A revision you cannot see answers the same code
          as one that does not exist, so the check is not an existence oracle. Lifecycle
          (Cancelled / Expired) is **not** screened at write time, because a revision can be
          cancelled long after it was chosen; the branch tree read and the comparison warn about
          it instead (`STORED_REVISION_RETIRED`).
        - **Why `claim` has no default.** If claiming a line to change its quantity also pinned its
          revision as a side effect, it would silently also mean "never accept a new revision of
          this part" — two decisions, one of them invisible at the call site.
        - **A pinned row can hide branch edits.** A pin on an assembly other than the revision its
          source line resolves to renders that revision's structure beneath it; see the
          [branch tree read](#operation/getBranchTree) and `PINNED_SUBTREE_HIDES_EDITS`.
        - **Changing or clearing a revision after the row exists** is an `update`, which keeps the
          row's quantity and find number unless it sends new ones. `convert-to-native` may also
          stamp **any** revision of the child item, or switch to tracking. That is legitimate, and
          it is the severing path; `update` is the non-severing one.

        ### Addressing quirks worth knowing

        - `update` accepts `ebomAssemblyId` **and has to**: a `base` row has no edge record, so
          that is the only id a client holds for the row whose update must come back
          `CLAIM_REQUIRED`. Without it the rejection could never be reached.
        - `revert` accepts `ebomAssemblyId` for the mirror reason: a reverted row renders with no
          branch record (`ciId` is null), so a *second* revert — which must answer `NO_CLAIM` — cannot be
          addressed any other way.
        - `replace` only works on eBOM-derived rows. A `new` row has a synthetic `new-…` edge
          key and no `Assembly__c` line, so replacing branch-added content is `update`, or
          `exclude` plus `add`.
        - A row **hidden behind a pin** (see `PINNED_SUBTREE_HIDES_EDITS`) is addressable by
          `ciId` for `exclude`, `restore`, `revert` and `convert-to-native`, and by `assemblyCiId`
          for `update` (its new quantity / find number render once the pin no longer
          hides the row). An `update` addressed by `ebomAssemblyId` still answers `NOT_FOUND`
          for it. `claim` of a hidden line answers `NOT_FOUND` too, deliberately: a line that
          renders nowhere has nothing visible to claim.

        ## Access

        Requires **create** on `Assembly_CI__c`, `CI__c`, `Assembly_CI_Rev__c`, `CI_Rev__c` and
        `Branch_Member__c`, **and edit** on `Assembly_CI__c` and `Assembly_CI_Rev__c` (upserted or
        edited in place), `CI_Rev__c` (updated when an operation freezes a predecessor) and
        `Branch__c` (every write advances the branch's write clock). Create and edit are not the same
        permission, and both are named so a partial grant is a 403 before anything is written.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Accepted and **ignored** in this version. Present so a client can start sending it without
            its first request failing.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeltaBatchRequest'
            examples:
              claimThenEdit:
                summary: Claim two eBOM lines — one tracking the source, one pinned (atomic, the default)
                value:
                  atomic: true
                  operations:
                    - op: claim
                      clientRef: row-motor
                      ebomAssemblyId: a0Bg8000000Ab10EAC
                      trackChildRevision: true
                    - op: claim
                      clientRef: row-bracket
                      ebomAssemblyId: a0Bg8000000Ab11EAC
                      childItemRevisionId: a0Ag8000000Ab31EAC
              claimRevisionChoiceMissing:
                summary: A claim that chose neither — refused REVISION_CHOICE_REQUIRED
                value:
                  operations:
                    - op: claim
                      clientRef: no-choice
                      ebomAssemblyId: a0Bg8000000Ab10EAC
              update:
                summary: Revise quantity and find number on a claiming edge
                value:
                  operations:
                    - op: update
                      clientRef: qty-fix
                      assemblyCiId: a1Eg8000000AbD1EAK
                      quantity: 4
                      findNumber: 10
              updateAutoClaim:
                summary: Claim a base line (tracking) and change its quantity in one operation
                value:
                  operations:
                    - op: update
                      clientRef: qty-in-one
                      ebomAssemblyId: a0Bg8000000Ab11EAC
                      quantity: 3
                      autoClaim: true
                      trackChildRevision: true
              updateRevisionPin:
                summary: Change a claim's stored revision, keeping its quantity and find number
                value:
                  operations:
                    - op: update
                      clientRef: take-rev-2
                      assemblyCiId: a1Eg8000000AbD1EAK
                      childItemRevisionId: a0Ag8000000Ab42EAC
              updateRevisionAndQuantity:
                summary: Change a row's revision and its quantity together — one operation, one fork
                value:
                  operations:
                    - op: update
                      clientRef: line-editor-save
                      assemblyCiId: a1Eg8000000AbD1EAK
                      childItemRevisionId: a0Ag8000000Ab42EAC
                      quantity: 3
              updateRevisionClear:
                summary: Clear a pin; a claim then tracks its source line at T_R
                value:
                  operations:
                    - op: update
                      clientRef: stop-pinning
                      assemblyCiId: a1Eg8000000AbD1EAK
                      trackChildRevision: true
              addLocal:
                summary: Add a part the eBOM never supplied
                value:
                  operations:
                    - op: add
                      clientRef: packaging
                      parentItemId: a02g8000000Ab01EAC
                      childItemId: a02g8000000Ab90EAC
                      quantity: 1
                      findNumber: 90
              addPinned:
                summary: Add a part held at a chosen revision rather than floating
                value:
                  operations:
                    - op: add
                      clientRef: fixture-rev-a
                      parentItemId: a02g8000000Ab01EAC
                      childItemId: a02g8000000Ab91EAC
                      childItemRevisionId: a0Ag8000000Ab96EAC
                      quantity: 1
                      findNumber: 95
              convertKeepingWhatItShows:
                summary: Convert a claim to native, stamping the revision the tree rendered
                value:
                  operations:
                    - op: convert-to-native
                      clientRef: keep-harness
                      ciId: a1Gg8000000AbF3EAK
                      childItemRevisionId: a0Ag8000000Ab61EAC
              excludeAndReplace:
                summary: Substitute an alternate part, and drop another line
                value:
                  operations:
                    - op: replace
                      clientRef: alt-motor
                      replacedEbomAssemblyId: a0Bg8000000Ab10EAC
                      newChildItemId: a02g8000000Ab91EAC
                      quantity: 1
                      findNumber: 10
                    - op: exclude
                      clientRef: drop-harness
                      ebomAssemblyId: a0Bg8000000Ab12EAC
              nonAtomic:
                summary: Best-effort — apply what is valid, report the rest
                value:
                  atomic: false
                  operations:
                    - op: claim
                      clientRef: ok
                      ebomAssemblyId: a0Bg8000000Ab11EAC
                      trackChildRevision: true
                    - op: update
                      clientRef: will-fail
                      ebomAssemblyId: a0Bg8000000Ab12EAC
                      quantity: 9
      responses:
        '200':
          description: |
            The batch report. Also returned when `atomic: false` and some operations failed — check
            `failed` and each `results[].success`, not the status code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeltaBatchResponse' }
              examples:
                allApplied:
                  summary: Two claims applied
                  $ref: '#/components/examples/DeltaBatchApplied'
                partial:
                  summary: '`atomic: false` — one applied, one refused'
                  $ref: '#/components/examples/DeltaBatchPartial'
                forked:
                  summary: An update that had to fork a frozen revision
                  $ref: '#/components/examples/DeltaBatchForked'
                autoClaimed:
                  summary: An update that claimed a base line (autoClaim)
                  $ref: '#/components/examples/DeltaBatchAutoClaimed'
                revisionSet:
                  summary: An update that changed a claim's stored revision
                  $ref: '#/components/examples/DeltaBatchRevisionSet'
        '400':
          description: |
            `INVALID_REQUEST` — the body could not be read; or (under `atomic: true`) an operation
            failed validation with a 400-mapped code: a missing required field, an unknown `op`, or
            an operation that refuses a past `asOf`.

            `ASOF_INVALID` / `ASOF_IN_FUTURE` — the batch's own `asOf`.

            Also `INVALID_REQUEST`, on `update`: none of `quantity`, `findNumber`,
            `childItemRevisionId`, `trackChildRevision: true` sent; `autoClaim` claiming a `base`
            edge at a past `asOf` (as a `claim` is; on an owned edge a past `asOf` stays
            tolerated); and a second operation on a row that is refused by the batch-slot rules
            (`already revised earlier in this same batch` / `that row already has a membership
            change earlier in this same batch`). `"op": "set-revision"` is an unknown op.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                unknownOp:
                  $ref: '#/components/examples/DeltaBatchUnknownOp'
                pastAsOfRefused:
                  value:
                    code: INVALID_REQUEST
                    message: "That request could not be read. Check that the body is valid JSON and that every required value is supplied. (convert-to-native decides from the branch's CURRENT provenance, which a past asOf cannot report; send it without one)"
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundPath' }
        '409':
          description: |
            An atomic batch failed validation, and the first failure's code was a 409. The body
            carries **every** failure in `failures[]`, not just the first — a caller fixing them one
            round trip at a time is the behaviour this endpoint exists to avoid.

            | code | Cause | Remedy |
            |---|---|---|
            | `CLAIM_REQUIRED` | a write targeted a `base` row | `claim` it first — or send the `update` with `autoClaim: true` and a revision choice |
            | `ALREADY_CLAIMED` | `claim` on a row this branch already owns | edit it directly |
            | `ALREADY_EXCLUDED` | `exclude` on a tombstoned row; or `convert-to-native` of one, which has no content to retain | `restore` it first |
            | `NOT_EXCLUDED` | `restore` on a row that is not excluded | nothing to restore — your view is stale |
            | `ALREADY_PRESENT` | `add` of a (parent, child) the branch already carries locally; or an op on a **replaced** row | edit the existing row; or act on the substitute |
            | `NO_CLAIM` | `revert` on a row the branch asserts nothing about; `convert-to-native` on a row that is already `new` | nothing to undo or sever |
            | `NOT_SUPPLIED` | `revert` on a row no source supplies — falling back would make it vanish | `exclude` instead |
            | `STALE_REVISION` | an `update` at a past `asOf` against a revision superseded since | reload and retry |
            | `NOT_EDITABLE` | the target is inside the subtree of a locally added or substituted assembly, or of a row holding a revision other than its source line's | only source-supplied content is editable |
            | `CONCURRENT_WRITE` | another transaction holds this branch's write lock | send the same request again |
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                claimRequired:
                  $ref: '#/components/examples/DeltaBatchAtomicFailure'
                concurrentWrite:
                  $ref: '#/components/examples/ConcurrentWrite'
        '413':
          description: |
            `BATCH_TOO_LARGE` — more than 200 operations. Split the change.

            `STRUCTURE_TOO_LARGE` — the branch is too large to validate the batch against in one
            transaction. Nothing is written. Splitting the batch does not help; see
            `StructureTooLarge`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                tooLarge:
                  value:
                    code: BATCH_TOO_LARGE
                    message: 'A single request can carry at most 200 operations. Split the change into smaller batches. (240 operations, maximum 200)'
                structureTooLarge:
                  $ref: '#/components/examples/StructureTooLarge'
        '422':
          description: |
            Impossible against the model.

            | code | Cause |
            |---|---|
            | `CYCLE_DETECTED` | the requested edge would make a child an ancestor of its own parent |
            | `PARENT_NOT_IN_BRANCH` | `add` targeted a parent that is not part of this configuration |
            | `EBOM_CYCLE` | the source eBOM already contains a cycle |
            | `UNSUPPORTED_CI_TYPE` | a delta named a configuration item of a type this version does not support |
            | `CI_IDENTITY_UNRESOLVED` | a configuration item has no data record, or one missing its identifying key — data corruption, never skipped |
            | `CI_IDENTITY_COLLISION` | two configuration items resolve to one identity, so one of their deltas would be silently discarded |
            | `PROVENANCE_INVALID` | a delta named a source that is not this branch's |
            | `REVISION_CHOICE_REQUIRED` | a `claim` or `convert-to-native` sent neither `childItemRevisionId` nor `trackChildRevision: true`, or sent both; an `update` sent both; an `update` with `autoClaim` that claims a `base` edge sent neither |
            | `REVISION_ITEM_MISMATCH` | a `childItemRevisionId` is not a revision of the operation's child item — or names no revision you can see |

            `REVISION_CHOICE_REQUIRED` is a property of the request alone, so it is checked once the
            target is named and before any claim or exclusion state: a `claim` of an
            already-claimed line that also chose nothing answers `REVISION_CHOICE_REQUIRED`, not
            `ALREADY_CLAIMED`. `REVISION_ITEM_MISMATCH` is checked after the state guards. On
            `update`, "neither" is refused only once the lookup shows the row is `base` and
            `autoClaim` is claiming it (message `update with autoClaim claims Assembly__c <edgeKey>,
            and a claim requires childItemRevisionId or trackChildRevision: true`), so an
            `autoClaim` update with no choice on a missing row answers `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                revisionChoiceRequired:
                  $ref: '#/components/examples/DeltaBatchRevisionChoiceRequired'
                revisionItemMismatch:
                  value:
                    code: REVISION_ITEM_MISMATCH
                    message: "The chosen revision is not a revision of this line's part that you can access. Choose a revision of this line's part. (1 of 1 operations failed validation)"
                    failures:
                      - index: 0
                        clientRef: fixture-rev-a
                        op: add
                        success: false
                        errorCode: REVISION_ITEM_MISMATCH
                        message: "The chosen revision is not a revision of this line's part that you can access. Choose a revision of this line's part. (Item_Revision__c a0Ag8000000Ab41EAC is not a revision of Item__c a02g8000000Ab91EAC)"
                        ciId: null
                        edgeId: null
                        forked: null
                        claimed: null
                cycle:
                  value:
                    code: CYCLE_DETECTED
                    message: 'This change would make the child an ancestor of its own parent, which no BOM can represent. (Sub-200 is already an ancestor of Assy-100)'
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================================================================== baselines

  /mbom/branches/{branchId}/baselines:
    post:
      tags: [Baselines]
      operationId: cutBaseline
      summary: Cut a baseline over a branch
      description: |
        Records the branch's full effective structure at one timepoint — **as that timepoint**.

        ## A baseline stores a timepoint, not rows

        The cut writes one `Baseline__c` record carrying its resolution timepoint
        (`resolutionTimePoint`), and nothing else about the content. Reading it back **replays the
        resolution** at that timestamp, which is exact because the resolution is a pure function of
        it and because nothing can ever land at or before a past T (every source acceptance and
        every branch edit is stamped with the wall clock when it is written).

        Storing the rows instead would cost one record per edge per cut — roughly 36 MB for an
        18,000-edge BOM.

        ## The freeze is what makes the replay honest

        A Draft row revision is edited **in place** by `update`. Replaying a timepoint would therefore
        follow an edit made *after* the cut, and the baseline would change without anyone touching
        it. So the cut freezes every revision the snapshot resolved to. From then on, every `update`
        to those rows forks a new revision instead (and comes back `forked: true`).

        ## Two timestamps, and why they are not one

        `resolutionTimePoint` is what the content was resolved at; `takenAt` is the wall-clock moment
        of the cut. Kept apart, a correction to the server clock cannot change what a baseline
        resolves to. The request names the timepoint `cutDateTime`; the response reports it as
        `resolutionTimePoint`.

        Both are reported **to the whole second** (milliseconds `.000`), matching what a later read
        of the same record returns.

        ## Stored canary counts

        The cut also stores how many rows are `claiming` and how many hold a chosen revision
        (`hasChosenRevision`). Neither is returned here — there is no `pinnedCount` —
        and both feed the baseline read's drift warnings.

        ## Excluded rows are not members

        `memberCount` counts what the configuration *contains*, so tombstoned rows are not counted —
        which means it is **not** the number of rows the tree endpoint renders. The baseline read
        filters on the same rule, so the stored count stays comparable to a later read.

        ## Immutable from the insert

        There is no draft-baseline state and no lock step: every update to a `Baseline__c` is refused
        outright, and every hard delete too.

        ## Access

        Requires **create** on `Baseline__c`, and **edit** on `CI_Rev__c` (the freeze) and
        `Branch__c` (the cut advances the branch's write clock). Named separately because a partial grant would otherwise fail half way through the
        cut — after the members resolve and before the freeze, the one state a baseline must never
        be left in.
      parameters:
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineCutRequest'
            examples:
              now:
                summary: Cut at the server clock
                value:
                  label: Pilot build 1
              backdated:
                summary: Cut as the configuration stood at an earlier moment
                value:
                  label: Pre-ECO snapshot
                  cutDateTime: '2026-03-01T00:00:00Z'
      responses:
        '201':
          description: |
            The baseline's header. 201 rather than the 200 the delta batch answers: this call names
            one new resource, where a batch reports on a set of operations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Baseline' }
              examples:
                cut:
                  value:
                    baselineId: a1Fg8000000AbE1EAK
                    label: Pilot build 1
                    resolutionTimePoint: '2026-04-06T14:31:02.000Z'
                    takenAt: '2026-04-06T14:31:02.000Z'
                    memberCount: 4
        '400':
          description: |
            `INVALID_REQUEST` — unreadable body, or a `label` longer than 80 characters.
            `ASOF_IN_FUTURE` — `cutDateTime` is later than now; a baseline of content that does not
            exist yet is not a baseline. `ASOF_INVALID` — it could not be parsed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                future:
                  value:
                    code: ASOF_IN_FUTURE
                    message: 'A timepoint cannot be in the future. Use now or an earlier moment. (2027-01-01T00:00:00Z)'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundPath' }
        '409':
          description: |
            `CONCURRENT_WRITE` — another transaction holds this branch's write lock (a delta batch or
            a pull commit in flight). The cut does not wait for the lock; send the same request
            again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                concurrentWrite:
                  $ref: '#/components/examples/ConcurrentWrite'
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '422':
          description: '`EBOM_CYCLE` — the source eBOM contains a cycle, so nothing can be resolved to cut.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mbom/baselines/{baselineId}/tree:
    get:
      tags: [Baselines]
      operationId: getBaselineTree
      summary: Read the rows a baseline captured
      description: |
        Re-resolves the branch at the baseline's stored `resolutionTimePoint` and returns the rows.

        ## `asOf` is refused, not ignored

        Every other tree read on this API takes one, and a client that has been sending it to
        `/branches/{id}/tree` will send it here. A baseline **pins its own timepoint**, so a second
        one has nothing to answer — accepting it would give the same rows to every value and let a
        caller believe they had asked a temporal question and got a temporal answer. Sending `asOf`
        is a `400 INVALID_REQUEST`.

        Paging, `rowKey`s, `snapshot` and `compare` work exactly as on the
        [branch tree read](#operation/getBranchTree). A baseline never changes, so `snapshot` only
        matters with `compare`, where it pins the target.

        ## Differences from the branch read

        - **Excluded rows are filtered out.** A tree read renders a tombstone so the editor can see
          what was removed; a baseline is the record of what the branch *contained*.
        - **`edgeId`, `edgeKey` and `ciId` are null, and the per-row governing clock is
          collapsed** — every row's `governingTimestamp` is the baseline's own
          `resolutionTimePoint`, never null. A baseline row does not pretend to answer questions it
          cannot, and cannot be edited. `isReplaced` **is** populated: leaving it null would render
          a substituted part identically to an ordinary one.
        - **No advice warnings.** A `MIXED_REVISION`, `PINNED_SUBTREE_HIDES_EDITS`,
          `MEMBER_ADD_COLLISION` or `STORED_REVISION_RETIRED` warning is advice about a branch
          someone is still editing; a baseline is a record of a decision already taken, so none is
          raised here. `warnings` is empty except for `REDLINE_AMBIGUOUS` under `compare`.
        - **Pinned rows reproduce exactly.** A row pinned to another revision re-resolves with that
          revision's `nested` structure beneath it and the source's lines suppressed, just as the
          branch read rendered it at the cut.
        - **Pinned rows name who chose the revision.** A row with
          `hasChosenRevision: true` carries `revisionChosenById` and `revisionChosenAt`, the
          creator and creation time of the branch revision (`CI_Rev__c`) it resolves through —
          populated exactly as on the branch read. `wasClaimed` is evaluated as of the baseline's
          own timepoint.

        ## The drift canaries — reported by the findings

        A drift canary compares counts over the **whole** baseline, which no page computes, so the
        canaries are reported by [`GET /baselines/{baselineId}/findings`](#operation/getBaselineFindings),
        not by this read.

        | warningCode | What moved |
        |---|---|
        | `BASELINE_COUNT_DRIFT` | the baseline re-derived a **different number of rows** than its cut recorded — a corrected release date, an edit to an already-released BOM |
        | `BASELINE_PROVENANCE_DRIFT` | the same rows came back with a **different number of them `claiming`** — a claim severed or added since the cut. The row count cannot see this, because severing one moves no row |
        | `BASELINE_PIN_DRIFT` | the same rows came back with a **different number of them holding a chosen revision** (`hasChosenRevision`) — a revision decision moved where neither the row count nor the claim count did |

        All three **warn rather than throw**: the rows returned are still the honest answer for the
        stored timepoint. The same canaries are raised on a comparison's baseline side.

        None is complete, and the response does not pretend otherwise. An edit that changes only
        a line's own fields, such as its quantity, moves no count.
      parameters:
        - $ref: '#/components/parameters/BaselineId'
        - $ref: '#/components/parameters/ParentRowKey'
        - $ref: '#/components/parameters/Depth'
        - $ref: '#/components/parameters/TreeLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/Compare'
      responses:
        '200':
          description: One page of the re-resolved rows. Empty `rows` for a baseline that resolved to nothing is a `200`, not an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BaselineTree' }
              examples:
                rows:
                  summary: The rows a baseline captured
                  $ref: '#/components/examples/BaselineTreeRows'
                pinnedAuthor:
                  summary: Who chose each row's revision, and when
                  $ref: '#/components/examples/BaselineTreePinnedAuthor'
        '400':
          description: |
            `INVALID_REQUEST` — `asOf` was supplied (a baseline is already resolved); or `limit`,
            `depth`, `cursor`, `snapshot` or `compare` is unusable, as on the branch tree read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                asOfRefused:
                  value:
                    code: INVALID_REQUEST
                    message: 'That request could not be read. Check that the body is valid JSON and that every required value is supplied. (a baseline is already resolved, so asOf has nothing to answer; read the branch if you want a timepoint)'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` — the path id names no baseline, `parentRowKey` names no row, or a `compare` target names nothing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '409':
          description: '`NOT_RELEASED` — `compare=ebom:{id}` names a revision that is not Released.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '422':
          description: '`CYCLE_DETECTED` — a cycle beneath the `compare` target''s root.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================================================================== pull

  /mbom/sources/{sourceId}/pull-preview:
    get:
      tags: [Pull]
      operationId: previewMbomPull
      summary: Preview the effect of accepting a newer eBOM revision
      description: |
        Diffs the eBOM resolved at the source's current T_R against the eBOM resolved at the
        candidate root revision's release date, and returns every difference as an individually
        addressable entry.

        **This call is pure.** It creates and modifies nothing — no branch edit, no row revision, no
        source revision. Calling it twice with the same inputs against an unchanged
        org returns identical entries, including identical `entryId` values and an identical
        `diffFingerprint`. Only the read clock moves: `generatedAt`, and the `governingTimestamp` of
        every state that answers to `asOf`.

        **Not every entry is a decision.** Most are informational: the caller is being told what will
        happen, not asked. Only `claim-orphaned` blocks a commit.

        **Already current is not an error.** If the branch already resolves against the newest
        released root revision, this returns `200` with `hasChanges: false` and an empty `entries`
        array — correct for a read, where a write would throw.

        ## The correlation key — why a pull doesn't orphan every claim on every release

        The two traversals are correlated on the BOM line's **`(Parent_Item__c, Item__c,
        Secondary_Unique_Key__c)`** — the parent *item*, not the parent revision. **Not** on the
        line's `edgeKey`.

        This is the load-bearing decision of the whole feature. When a parent item revs, Propel
        clones its entire BOM into new `Assembly__c` rows with new ids — so a branch that claimed a
        line under rev-1 holds a line id that does not exist under rev-2. A join on `edgeKey` would
        orphan every claimed edge and re-add every upstream line **on every single pull**. The
        parent item does not move when its revision does, which is exactly what lets this key survive
        the clone. `edgeKey` still identifies the edge *for display*; it just is not the join key.

        `Secondary_Unique_Key__c` rather than `Find_Number__c` because find-number uniqueness is org
        configuration, and a key built on it would give two orgs with identical data different diffs.

        The key is **not unique** on one side when a parent item renders at two revisions in the
        same tree, which is routine, because each occurrence of a pinned item renders its own
        revision's structure. Revising an item copies each line's `Secondary_Unique_Key__c`
        unchanged, so both revisions' copies of a line share one key. So within one side, edges at one key are
        also told apart by their **parent revision**, the revision whose line each sits on, and a
        pull over such a tree completes. The parent revision separates; it never joins, and it is
        not part of the key: a branch edge and its source counterpart carry different parent
        revisions once the source advances. Across the sides, edges at one key pair by equal
        parent revision first, and then a lone edge left on each side pairs with the other — the
        source advancing. A null parent revision never pairs by equality, only as a lone survivor;
        `nested` rows pair in a second pass and never refuse. There is no tie-break on find number.

        A live `replace` substitute borrows the key of the line it supersedes, and correlates
        **through that line**. While upstream keeps the superseded line, the substitute
        is `claim-retained` (`claimKind: replace`, `retargeted: false`, no actions; its `entryId`
        derives from the superseded line's key and `candidate` is that line) on every pull, since
        a substitute always diverges from the line it replaces. Only when upstream drops the
        superseded line is it `claim-orphaned`. It is never judged against a line of its own new
        child that upstream supplies at the borrowed key; that line is `member-added`. When
        upstream adopts the substitution itself (drops the superseded line and adds a line of the
        substitute's child at its position), the substitute is `claim-orphaned` and upstream's
        line is `member-added`.

        Where the join still cannot tell which upstream line corresponds to which branch line, the
        pull answers `AMBIGUOUS_CORRELATION` (422) rather than guess. The three shapes that raise
        it, and their remedies, are listed under the 422 response.

        ## The two sides are deliberately asymmetric

        - **current** — the branch resolved at the accepted T_R, *with* its own deltas overlaid.
        - **candidate** — the **raw** upstream walk at the candidate T_R, with **no overlay at all**.

        Overlaying the branch onto the candidate side would match nothing (the deltas are keyed on
        line ids that do not exist under the new root) and would append every delta as an unmatched
        local edge — which **resurrects the orphans**, correlating a claim on a removed line with the
        branch's own edge so `claim-orphaned` is never raised. That entry is the only required
        decision in the entire feature; silently losing it would make a commit that should block
        succeed.

        ## Entry kinds

        | kind | decision | availableActions | Meaning |
        |---|---|---|---|
        | `source-version-advance` | informational | — | The root item revision advances; nothing structural beneath it changed. |
        | `member-version-advance` | informational | — | An edge's child resolves to a newer released revision because T_R moved. |
        | `member-added` | informational | — | The candidate adds an edge the branch has no native edge on. Enters automatically. |
        | `member-removed` | informational | — | The candidate removes an edge the branch never claimed or replaced. Applies automatically. |
        | `claim-retained` | informational | `accept-fields` (optional); none on a `replace` substitute | The branch's claim still differs from upstream; the branch wins and upstream is suppressed unless the commit accepts fields. `retargeted` distinguishes a suppressed **field value** from a suppressed **re-target**. |
        | `claim-superseded` | informational | `release` (optional) | The branch's claim now *matches* what the candidate would natively produce. |
        | `claim-orphaned` | **required** | `convert-to-native`, `remove` | The candidate removes an edge the branch **claimed or replaced**. **Blocks the commit.** |
        | `member-add-collision` | informational | `accept-fields` (optional) | The candidate adds an edge whose correlation key coincides with a branch-**native** edge, and the two **differ**. The branch's content wins and is left untouched unless the commit accepts fields. |
        | `member-add-converged` | informational | — | The same collision, except the candidate's quantity, find number **and** resolved child revision are all identical to the branch's own. The commit retires the branch's now-redundant local edge (`action: "retired"`); the position becomes ordinary `base` content. |

        `member-add-collision` and `member-add-converged` are the same coincidence resolving two
        ways. Converged requires all three of quantity, find number and resolved child revision to
        match; any difference makes it a plain collision. Neither is ever a decision: on a
        collision nothing is written and the branch's row stands, and on a converged entry the
        commit retires the branch's local edge. A `claim-superseded` claim is never retired.

        ### Optional decisions

        Three kinds offer **optional** per-field decisions. Their `decision` stays
        `informational`; "optional" is a non-empty `availableActions` on an informational entry.
        A pull has exactly one **required** kind, `claim-orphaned`, permanently, and an undecided
        optional entry never blocks a commit — a preview with hundreds of entries and no
        `claim-orphaned` still commits with zero decisions.

        | kind | availableActions |
        |---|---|
        | `claim-retained` (any claim but a `replace` substitute — pinned or tracking, retargeted or not) | `["accept-fields"]` |
        | `claim-retained` with `claimKind: replace` (a live substitute) | `[]` |
        | `member-add-collision` | `["accept-fields"]` |
        | `claim-superseded` | `["release"]` |
        | `claim-orphaned` | `["convert-to-native", "remove"]` (required) |
        | every other kind | `[]` |

        `accept-fields` is offered on every such entry **without checking that some field could be
        taken**. Where the only divergence is one the commit refuses (for example a collision
        differing only on a find number the candidate line leaves blank), every `acceptedFields`
        is refused `400 INVALID_REQUEST`; leave the entry undecided and the branch's value wins.
        See the [pull commit](#operation/commitMbomPull) for what each field and value does.

        `diffFingerprint` digests each entry's `availableActions` (and `revisionAdvances`). The
        fingerprint does **not** cover the commit's `decisions[]`, so one preview's fingerprint
        is valid for a commit with or without `acceptedFields`.

        Preview entries and `warnings` describe the tree with **no optional decision taken**. An
        accepted revision that lifts a post-pull pin is not previewed: a
        `PINNED_SUBTREE_HIDES_EDITS` warning for that pin no longer applies after such a commit,
        and the lines entering, leaving or rendering again beneath it are not listed.

        ### `revisionAdvances`

        `claim-retained` and `claim-superseded` carry `revisionAdvances`: `true` when a
        **tracking** claim's rendered revision moves with this pull. No new entry kind is added,
        so each position still has exactly one entry, and `member-version-advance` still means
        `base` content only.

        ### Why a revision advance is never a decision

        A revision is not an independently assertable value. Once you accept that the *line* exists,
        which revision it resolves to is a deterministic output of the as-of traversal against T_R —
        there is no alternative to offer. The way to hold a revision is to **pin** it — a `claim`
        (or `add`, `replace`, `convert-to-native`) carrying a chosen `childItemRevisionId`, a
        separate and deliberate act on the delta endpoint. A *tracking* claim holds nothing: it
        follows the source's revision and moves with it.

        A `base` row's advance is still never a decision. A *pinned* claim that upstream has moved
        past can optionally take the candidate's revision through `accept-fields`
        (`{"childItemRevisionId": "candidate"}`) or start tracking (`"release"`), keeping
        everything else. A tracking claim's move is flagged with `revisionAdvances` on its
        `claim-*` entry.

        ### Pins are judged against the tree *after* the pull

        A row pinned to a revision other than its source line's renders that revision's structure
        beneath it, and the source's lines there are suppressed. Which rows that applies to is
        decided on the **post-pull** tree, not today's: a pin that upstream moves past becomes one
        that suppresses structure, and a pin upstream converges onto, removes or moves stops being
        one. Lines hidden behind a post-pull pin get no entry of their own. A branch edit such a pin
        will hide is reported instead as a `PINNED_SUBTREE_HIDES_EDITS` warning — the same warning
        the tree read will raise once the commit lands — because the preview is the last point at
        which the caller can see that coming.

        Pins are judged **per occurrence**, as the tree renders them. A line behind a
        pin on one occurrence that another, unpinned occurrence of the same item still renders is
        not hidden: it is reported there like any other line, as `member-added` when it is new.
        A hidden-edit warning is raised once per pinned row and hidden item.

        A live `replace` substitute hidden behind a post-pull pin gets no entry while hidden — only
        a `PINNED_SUBTREE_HIDES_EDITS` naming the substitute's item — and is `claim-retained` once
        the pin lifts. A branch `add` beneath a live substitute whose superseded line upstream
        keeps renders after the commit, so it draws no hidden-edit warning.

        A pinned claim whose line upstream re-revs is reported as `claim-retained` with
        `retargeted: true`: the candidate would resolve the line to a newer revision, and the pin
        wins. The commit leaves the pin in place — unless it carries an `accept-fields` decision
        naming `childItemRevisionId`. With `candidate`, the pin moves to the candidate's revision,
        equals the post-pull source line's, and stops rendering a pinned structure, so edits it
        hid render again; the next pull that moves the line reports `retargeted: true` again.
        With `release`, the claim stores no revision and becomes a tracking claim, never
        `retargeted` again.

        ### Why upstream re-pointing an edge at a *different item* is two entries

        The correlation key includes the child item, so it never correlates as one matched pair. It
        decomposes into an independent `member-removed` (or `claim-orphaned`) and an independent
        `member-added`. `retargeted: true` therefore means a different child **revision**, not a
        different child item.

        ## Paging

        Entries come in pages of `limit` (default 200). **Every `required` entry comes before any
        informational one**, so the first page shows the blockers. `decision=required` returns the
        required entries only — the whole set a commit must decide.

        `summary`, `diffFingerprint` and `previewId` describe the **complete** diff on every page,
        so a caller knows the size of the diff before paging, and can commit from any page. Follow
        `page.nextCursor` for the rest. Each page continues after the last entry the previous page
        returned, and the set of positions is fixed by the state the first page resolved, so no
        entry is skipped or repeated while the diff stays the same. A Draft row's quantity or find
        number edited in place between pages shows its newer value on later pages. If that edit
        changes how an entry is reported, that one entry may be skipped or repeated, and
        `diffFingerprint` and `previewId` change with it, so a commit carrying the earlier ones
        answers `409 STALE_REVISION`.

        `previewId` names this preview. Send it on the commit. Today it is checked like
        `diffFingerprint`; a later version may hold a large diff server-side under it.

        ## Size

        Pull preview and commit support structures up to 15 levels deep. A deeper structure may
        answer `413 STRUCTURE_TOO_LARGE`.

        **`202 Accepted` is reserved** for a later version that previews a very large pull as a
        background job: the body would carry `status: accepted` and a `jobId`. This version always
        answers `200` with `status: completed`, but a client should treat `status` as the outcome
        rather than assume `200`.

        ## Target rows

        Each entry tied to a row of the branch's current tree names it in `target.rowKey`, the
        same key the [branch tree read](#operation/getBranchTree) uses, so a client can show the
        entry in the tree. It is null for `member-added` (the branch has no such row yet) and for
        `source-version-advance` (about the root).

        ## Access

        **Gated on write, not read.** A read-only user is rejected before a pull is even previewed:
        the preview requires exactly the create and edit grants that `pull` itself requires.
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - name: candidateRootRevisionId
          in: query
          required: false
          description: |
            The released `Item_Revision__c` of the source's root item to preview accepting. When
            omitted, defaults to that item's **latest released revision**.

            Must belong to the same root item the source already references, must be Released (and
            not Cancelled or Expired — the same test that applies when an MBOM is first created), and
            must not resolve to a timestamp at or earlier than the source's current T_R.
          schema:
            $ref: '#/components/schemas/SalesforceId'
        - name: decision
          in: query
          required: false
          description: |
            `required` returns only the entries a commit must decide; `informational` only the
            rest. Omitted returns both, required first. Anything else is `400 INVALID_REQUEST`.
            `summary` always covers the whole diff.
          schema: { $ref: '#/components/schemas/Decision' }
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: |
            One page of the computed diff, returned bare. Also returned, with `hasChanges: false`
            and no entries, when the branch is already current.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PullPreview' }
              examples:
                changesPending:
                  summary: Assy-100 rev-1 → rev-2, one blocking orphan
                  $ref: '#/components/examples/PullPreviewWithChanges'
                alreadyCurrent:
                  summary: Branch already on the newest released revision
                  $ref: '#/components/examples/PullPreviewNoChanges'
                paged:
                  summary: '`limit=2` — the required entry first, more to come'
                  $ref: '#/components/examples/PullPreviewPaged'
                revisionMoves:
                  summary: A retargeted pinned claim offered accept-fields; a tracking claim flagged revisionAdvances
                  $ref: '#/components/examples/PullPreviewRevisionMoves'
                perFieldDecisions:
                  summary: accept-fields and release offered
                  $ref: '#/components/examples/PullPreviewPerFieldDecisions'
        '400':
          description: |
            `INVALID_REQUEST` — `limit` is not a positive integer up to 2000, `decision` is not
            `required` or `informational`, or `cursor` was not issued by this endpoint for this
            source. Present-but-unusable is a 400 rather than a silent fallback to the default.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                badLimit:
                  value:
                    code: INVALID_REQUEST
                    message: 'That request could not be read. Check that the body is valid JSON and that every required value is supplied. (limit 0)'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` — the source, or `candidateRootRevisionId`, does not exist.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                notASource:
                  value:
                    code: NOT_FOUND
                    message: 'That record does not exist, or you do not have access to it. (a1Bg8000000AbCdEAK is not a Branch_Source__c)'
        '409': { $ref: '#/components/responses/PullConflictPreview' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '422': { $ref: '#/components/responses/PullUnprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mbom/sources/{sourceId}/pull:
    post:
      tags: [Pull]
      operationId: commitMbomPull
      summary: Commit a previewed pull, advancing T_R
      description: |
        Accepts a newer eBOM root revision into the branch: appends a new `Branch_Source_Rev__c`
        advancing T_R, applies the caller's `claim-orphaned`
        dispositions and any optional decisions, and retires any `member-add-converged` local
        edge — **all in one transaction, all or nothing**.

        Returns **`201 Created`**, not 200: a new acceptance record genuinely exists. The body's
        `status` is `completed`.

        **`202 Accepted` is reserved** for a later version that commits a very large pull as a
        background job: the body would carry `status: accepted` and a `jobId`. This version always
        commits synchronously, but a client should treat `status` as the outcome rather than assume
        `201`.

        ## The diff is never trusted from the client

        This endpoint **re-resolves the same diff server-side**, through the same code path the
        preview used, and answers `STALE_REVISION` the moment the re-resolved `diffFingerprint`
        disagrees with what you echoed back, a `previewId` you sent no longer names that diff, or
        an `entryId` in `decisions[]` no longer names an entry in it. Re-preview and resubmit.

        A useful side effect: every preview-time failure mode (`NOT_RELEASED`,
        `CANDIDATE_ROOT_MISMATCH`, `CANDIDATE_NOT_NEWER`, `CYCLE_DETECTED`, `NOT_FOUND`) applies here
        for free — nothing in the commit path re-implements them.

        ## Decisions

        A decision is accepted **iff its `action` is in that entry's `availableActions`** (see the
        preview). `action` is matched ignoring case and echoed in `applied[]` in its canonical
        lowercase spelling.

        | Situation | Result |
        |---|---|
        | A `claim-orphaned` entry with **no** decision | `409 DISPOSITION_REQUIRED` — the whole commit is rejected. There is no default-accept tier. `claim-orphaned` is the only kind that blocks. |
        | An optional entry (`claim-retained`, `member-add-collision`, `claim-superseded`) with no decision | Commits; the branch's value wins and nothing is written for it. |
        | A decision whose `action` its entry does not offer | `400 INVALID_REQUEST` — `entryId <id> is <kind>, which offers no <action> decision`. |
        | A `convert-to-native` decision with neither or both of `childItemRevisionId` / `trackChildRevision: true` | `422 REVISION_CHOICE_REQUIRED` — the whole commit is rejected before any delta or acceptance is written. |
        | `childItemRevisionId`, or `trackChildRevision: true`, beside any action but `convert-to-native` | `400 INVALID_REQUEST`. `trackChildRevision: false` chooses nothing and is accepted beside every action. |

        | action | On | Effect |
        |---|---|---|
        | `convert-to-native` | `claim-orphaned` | Severs the provenance link, keeping the branch-owned quantity and find number, which then resolve on the **branch** clock. **Requires exactly one of** `childItemRevisionId` (stamped onto the native row — send the entry's own `current.detail.childItemRevisionId` to keep what it shows) and `trackChildRevision: true` (float at the read clock); neither or both is `422 REVISION_CHOICE_REQUIRED`, checked with the other decision checks before anything is written. Runs through the ordinary `convert-to-native` delta operation — every invariant that batch enforces applies unchanged, including `REVISION_ITEM_MISMATCH`. |
        | `remove` | `claim-orphaned` | Appends an **exclude** delta (a deletion marker). **Nothing is hard-deleted.** |
        | `accept-fields` | `claim-retained` (not a `replace` substitute), `member-add-collision` | Takes the fields named in `acceptedFields` and keeps every other field's branch value. Compiles to **exactly one** `update` on the entry's edge — quantity and revision on one row are one operation and one fork. A claim stays a claim; a native row stays native. |
        | `release` | `claim-superseded` | A **`revert`** of the claim, pinned or tracking alike: the branch stops owning the row, which renders upstream's line — identical to what it rendered, since the claim had converged. Takes no `acceptedFields`. |

        ### `acceptedFields`

        Maps field → value. Field names are the `AssemblyEdgeDetail` wire names `quantity`,
        `findNumber` and `childItemRevisionId`; values are `candidate` and `release`. Names and
        values are case-insensitive and echoed canonically. A field omitted keeps the branch's own
        value.

        | field | `candidate` | `release` |
        |---|---|---|
        | `quantity`, `findNumber` | Take the candidate line's value. Refused if the branch already equals it, or if the candidate line leaves it blank (or, for quantity, it is 0 or negative). | **Refused** — there is no source value to fall back to on its own; take the candidate's, or `release` the whole claim from `claim-superseded`. |
        | `childItemRevisionId` | **Pin** the revision upstream resolves now. It stays pinned: the next pull that moves upstream reports `claim-retained` with `retargeted: true`. Only where the revision diverges (a retargeted pinned claim; a collision whose resolved revisions differ — a floating collision becomes pinned). | **Store nothing** (= `trackChildRevision: true`). A claim becomes a **tracking claim**: it follows its source line at T_R, never `retargeted`. A native row (collision) **floats** at the read clock. Only where the branch holds a revision. |

        A tracking claim stores no revision, so `childItemRevisionId` is never assertable on one,
        even when `current` and `candidate` render different revisions.

        ### No fixed decision limit

        Every decision that writes compiles to exactly one delta operation, applied inside the
        commit's one transaction. **There is no fixed count**: a pull needing a thousand
        `claim-orphaned` decisions sends a thousand, in one commit. The same holds for the automatic
        retirement of `member-add-converged` entries.

        The limit is what one transaction can process. When the pull's resolutions and writes
        would exceed it, the commit is refused whole with `413 STRUCTURE_TOO_LARGE`, and nothing
        is written. Splitting the decisions does not help, because a pull commit is atomic and an
        undecided `claim-orphaned` entry blocks it. A later version may answer such a commit
        `202 Accepted` instead, taking the same request body.

        Pull preview and commit support structures up to 15 levels deep. A deeper structure may
        answer `413 STRUCTURE_TOO_LARGE`.

        ## Claim reconciliation: reported, never persisted

        For every existing claimed/replaced field, the commit compares the claim's current value
        against what the candidate traversal would natively produce:

        - **Differs** → reported as `claim-retained` / **reaffirmed**. It stays active and
          continues to govern future pulls. **Nothing new is persisted** — the comparison is
          reconstructed from the accepted source version on every pull, so a "reaffirmation" record
          would change no rendered value.
        - **Matches** → reported as `claim-superseded`. Also **never deleted and never written**.
          Retiring it would mean a branch that once happened to agree with upstream would silently
          start accepting upstream changes from then on.

        Nothing is persisted *unless the caller decided*: an `accept-fields` decision writes one
        `update` for its row, and a `release` one `revert`.

        A row's `edgeKey` is likewise **never re-stamped**. It keeps meaning "the upstream line this
        edge was originally minted against", independent of the correlation key a
        pull actually joins on.

        ## Retiring a converged local add

        A `member-add-converged` entry is retired without a decision. "Retired" means **one revert appended
        to the branch log** — nothing is deleted, and a read dated before this commit still renders the local add. The
        position becomes ordinary `base` content resolved at the new T_R, so it follows the source
        from then on.

        Reported in `applied[]` as `{"kind": "member-add-converged", "action": "retired"}`, inside
        the same transaction as the rest of the commit.

        ## Atomicity

        The decisions and the new acceptance are written in one transaction and rolled back together
        on any failure in either. A failure part way leaves the prior accepted revision and T_R
        in place, with no orphaned claim, exclude or claim-status records.

        ## The already-current commit

        A commit submitted when the candidate equals the currently-accepted root **still succeeds**:
        it appends a new acceptance (a new acceptance time, the same T_R) and returns `applied: []`. Same reading the preview takes of the read side.

        ## What a pull leaves alone

        Branch-**native** content is unaffected, with one exception: the `member-add-converged`
        retirement above. A local add that still differs from the source (`member-add-collision`) is
        left untouched, as is native content the source never collided with.

        ## Access

        Requires **create** on `Branch_Source_Rev__c`, `Branch_Member__c`, `CI__c`, `CI_Rev__c`,
        `Assembly_CI__c` and `Assembly_CI_Rev__c`, **and edit** on `Branch__c`, `Assembly_CI__c`,
        `Assembly_CI_Rev__c` and `CI_Rev__c`. Both gates run **before the body is read**.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullCommitRequest'
            examples:
              withDisposition:
                summary: Keep an orphaned claim as branch-owned content, at the revision it shows
                value:
                  candidateRootRevisionId: a0Ag8000000Ab02EAC
                  diffFingerprint: 'sha256:9f2c41ab7e08d3b6'
                  previewId: 'pv1.Xk3q9fA2c41ab7e0'
                  decisions:
                    - entryId: f4880c6b3e1a9d75
                      action: convert-to-native
                      childItemRevisionId: a0Ag8000000Ab61EAC
              convertTracking:
                summary: Keep an orphaned claim, letting its revision float at the read clock
                value:
                  candidateRootRevisionId: a0Ag8000000Ab02EAC
                  diffFingerprint: 'sha256:9f2c41ab7e08d3b6'
                  decisions:
                    - entryId: f4880c6b3e1a9d75
                      action: convert-to-native
                      trackChildRevision: true
              acceptCandidateRevision:
                summary: Take the newer revision on a retargeted pinned claim, keep its quantity
                value:
                  candidateRootRevisionId: a0Ag8000000Ab02EAC
                  diffFingerprint: 'sha256:4c0d9e72b1a83f56'
                  decisions:
                    - entryId: '8a3e5f09c2d71b64'
                      action: accept-fields
                      acceptedFields: { childItemRevisionId: candidate }
              trackSourceRevision:
                summary: Stop holding a revision on a retargeted pinned claim — it tracks its source line from now on
                value:
                  candidateRootRevisionId: a0Ag8000000Ab02EAC
                  diffFingerprint: 'sha256:4c0d9e72b1a83f56'
                  decisions:
                    - entryId: '8a3e5f09c2d71b64'
                      action: accept-fields
                      acceptedFields: { childItemRevisionId: release }
              acceptFields:
                summary: Keep my quantity, take the revision; take a quantity; release a claim
                value:
                  candidateRootRevisionId: a0Ag8000000Ab02EAC
                  diffFingerprint: 'sha256:b5e81c3a9f04d267'
                  decisions:
                    - entryId: '8a3e5f09c2d71b64'
                      action: accept-fields
                      acceptedFields: { childItemRevisionId: candidate }
                    - entryId: 'c7d42a9e0b15f386'
                      action: accept-fields
                      acceptedFields: { quantity: candidate }
                    - entryId: '3b91c7e0d5a2f846'
                      action: release
              removeOrphan:
                summary: Let the orphaned claim go
                value:
                  candidateRootRevisionId: a0Ag8000000Ab02EAC
                  diffFingerprint: 'sha256:9f2c41ab7e08d3b6'
                  decisions:
                    - entryId: f4880c6b3e1a9d75
                      action: remove
              noDecisions:
                summary: A diff with no required entries
                value:
                  candidateRootRevisionId: a0Ag8000000Ab02EAC
                  diffFingerprint: 'sha256:1b7e3390cc02af41'
                  decisions: []
      responses:
        '201':
          description: 'The pull was committed (`status: completed`). A new `Branch_Source_Rev__c` now exists.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PullCommitResult' }
              examples:
                committed:
                  $ref: '#/components/examples/PullCommitCommitted'
                alreadyCurrent:
                  summary: Committing the revision already accepted
                  $ref: '#/components/examples/PullCommitAlreadyCurrent'
                acceptedFields:
                  summary: accept-fields and release applied
                  $ref: '#/components/examples/PullCommitAcceptedFields'
        '400':
          description: |
            `INVALID_REQUEST` — nothing is written. The detail (in parentheses in `message`) is
            prefixed `entryId <id>: ` unless shown otherwise.

            | Detail | When |
            |---|---|
            | *(body unreadable)* | the body could not be read |
            | `entryId <id> is <kind>, which offers no <action> decision` *(no colon)* | `action` not in the entry's `availableActions` — including `release` on a non-superseded entry and `accept-fields` on `claim-orphaned` |
            | `entryId <id> has more than one decision` | duplicate decision |
            | `childItemRevisionId and trackChildRevision are only taken with convert-to-native, not with <action>` | a top-level revision choice beside any other action (`trackChildRevision: false` is not refused) |
            | `acceptedFields is only taken with accept-fields, not with <action>` | a non-null map beside `remove`, `convert-to-native` or `release` |
            | `an accept-fields decision names no field; name at least one of quantity, findNumber, childItemRevisionId` | map null or `{}` |
            | `acceptedFields names childItem, which is not assertable: …` | key `childItem` — upstream re-pointing a line at another item is a removal plus an addition |
            | `acceptedFields names <key>, which is not an assertable field; name quantity, findNumber, childItemRevisionId` | any other unknown key, including `childItemRevision` |
            | `acceptedFields names <field> more than once` | the same field twice, differing only in case |
            | `acceptedFields.<field> is <value>; a named field takes candidate or release` | a value other than `candidate` / `release` |
            | `acceptedFields.<quantity\|findNumber> is release, but … has no source value to fall back to on its own; …` | `release` on quantity / find number |
            | `acceptedFields.<quantity\|findNumber> is candidate, but the branch's … already equals the candidate's; there is nothing to accept` | non-diverging quantity / find number |
            | `acceptedFields.quantity is candidate, but the candidate line resolves no quantity to take` | candidate line has no quantity |
            | `acceptedFields.findNumber is candidate, but the candidate line resolves no find number to take` | candidate line has no find number |
            | `acceptedFields.quantity is candidate, but the candidate line's quantity (<q>) cannot be taken; a branch row needs a positive quantity` | candidate quantity 0 or negative |
            | `acceptedFields.childItemRevisionId is <candidate\|release>, but this is a tracking claim: …` | revision named on a tracking `claim-retained` |
            | `acceptedFields.childItemRevisionId is release, but the branch holds no revision on this row to release; it already floats` | `release` on a floating collision |
            | `acceptedFields.childItemRevisionId is candidate, but the branch already resolves the candidate's revision; there is nothing to accept` | non-diverging revision |
            | `acceptedFields.childItemRevisionId is candidate, but the candidate line resolves no revision to pin` | candidate resolves no revision (rare) |
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                notActionable:
                  value:
                    code: INVALID_REQUEST
                    message: 'That request could not be read. Check that the body is valid JSON and that every required value is supplied. (entryId b7204de9a1c6f358 is member-added, which offers no accept-fields decision)'
                fieldDoesNotDiverge:
                  summary: Accepting a field that does not differ
                  value:
                    code: INVALID_REQUEST
                    message: "That request could not be read. Check that the body is valid JSON and that every required value is supplied. (entryId 8a3e5f09c2d71b64: acceptedFields.findNumber is candidate, but the branch's findNumber already equals the candidate's; there is nothing to accept)"
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` — the source, or the candidate revision, does not exist.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '409': { $ref: '#/components/responses/PullConflictCommit' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '422': { $ref: '#/components/responses/PullUnprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================================================================== comparison

  /mbom/branches/{branchId}/comparison:
    get:
      tags: [Comparison]
      operationId: compareBranch
      summary: Compare a branch against another configuration
      description: |
        The structural difference between two configurations: which members each holds, and where
        the two disagree on quantity, find number or the child revision they resolve to.

        The **left** side is the branch the path names. The **right** side is named by
        `rightKind` + `rightId`, and may be another branch, a baseline, a source, or a released
        eBOM revision — so one endpoint answers eBOM-against-MBOM, MBOM-against-MBOM and
        MBOM-against-its-own-baseline rather than three.

        **This call is pure.** Nothing is written. Two calls with the same inputs against an
        unchanged org return identical entries, `entryId` values included. Only the read clock moves:
        `generatedAt`, each side's `asOf` when the caller sent none, and the `governingTimestamp` of
        every state that answers to `asOf`.

        ## The right-hand side

        | `rightKind` | `rightId` names | Resolves to | Its clock |
        |---|---|---|---|
        | `branch` | `Branch__c` | the branch's own effective structure, deltas overlaid | `rightAsOf`, defaulting to now |
        | `baseline` | `Baseline__c` | the branch re-resolved at the boundary the cut recorded | the baseline's own `resolutionTimePoint`; `rightAsOf` is **refused** |
        | `source` | `Branch_Source__c` | what that source *supplies*, with no branch deltas folded in | the acceptance in effect at `rightAsOf` |
        | `ebom` | `Item_Revision__c` | a raw eBOM walk beneath that revision, no branch in the picture | `rightAsOf`, defaulting to **that revision's release date** |

        `rightKind` is matched **case-insensitively** — `rightKind=Branch` is a 200. The values
        are published lower-case and that is the spelling to send.

        A `source` with nothing accepted yet resolves to no root and no members. That is a `200`,
        not an error: every member of the other side lands as added or removed.

        ## Entry kinds

        | kind | Meaning |
        |---|---|
        | `root-version-differs` | The two sides resolve **different root revisions**. One entry per comparison, never one per edge. |
        | `member-added` | The correlation key is present on the **right** and absent on the left. |
        | `member-removed` | The correlation key is present on the **left** and absent on the right. |
        | `member-differs` | Present on both, content disagrees. `differingFields[]` names which of `quantity` / `findNumber` / `childRevision`. |
        | `member-unchanged` | Present on both and identical. **Emitted only when `includeUnchanged=true`.** |

        One entry per correlation key, always — which is why `member-differs` carries a list rather
        than splitting into three kinds. `entryId` hashes `(kind, parent item, child item,
        secondary unique key)`, so two entries on one key would collide.

        `root-version-differs` fires whenever the two **resolved root revisions** differ, and that
        includes the case where the two roots are different *items* — a different item's revision
        is trivially a different revision. That is what stops `identical` reporting two unrelated
        assemblies as the same configuration. The abnormal shape is named separately, by the
        `COMPARE_ROOTS_DIFFER` warning.

        ### The correlation key is the pull's key

        `(Parent_Item__c, Item__c, Secondary_Unique_Key__c)` — the same join
        [pull-preview](#operation/previewMbomPull) documents in full, for the same reason: the
        parent *item* does not move when its revision does, so the key survives the BOM clone a
        revision advance performs. Edges at one key are told apart and paired exactly as on the
        pull: by parent revision within a side, so a side that renders one parent item at two
        revisions compares cleanly. A `replace` substitute that stands aside is a one-sided
        member. Where the join cannot tell which member corresponds to which, the answer is
        `AMBIGUOUS_CORRELATION` (422) rather than a guess.

        ### Exclusion tombstones are filtered out before the join

        Both sides are reduced to what the configuration *contains* — the same rule a baseline
        read applies — so a tombstone never becomes a member. A member excluded on the left therefore surfaces as **`member-added`** against a
        right that still supplies it: the left does not contain it and the right does, which is the
        honest answer for a symmetric compare and what keeps branch-against-baseline
        self-consistent, since a baseline's rows were filtered by that same rule when it was cut.

        ### Provenance is reported, never classified

        Each entry's `left` / `right` state carries `provenance` and `governingClock`, so a
        claiming-versus-base difference is visible without a kind of its own. A provenance-only
        difference is **not** a content difference and produces no entry: the same part at the same
        quantity in the same position is the same member however each side came to hold it. A
        branch that claimed a member without changing it therefore reads as unchanged against its
        own source.

        ## What a comparison deliberately does not have

        - **No decision tier and no actions.** A comparison initiates nothing, so `decision`,
          `availableActions`, `retargeted` and `claimKind` are **absent** from an entry rather
          than defaulted — a consumer cannot read a default as an answer. That is also why
          `CompareEntry` is not the pull's `DiffEntry`, whose `current` / `candidate` naming would
          be a lie on a symmetric pair.
        - **No `diffFingerprint`.** The pull carries one so a commit can fail fast on a stale
          preview. There is no commit here, so a digest would be a field nobody could act on.

        ## `summary`, and the one thing that is easy to get wrong

        `total` and `byKind` count the entries **emitted**, so both move with `includeUnchanged`.
        `added`, `removed`, `differing` and **`unchanged` do not** — `unchanged` is derived from the
        matched correlation keys and is therefore **populated whether or not the unchanged rows were
        asked for**. That is the point of it: the default response emits no row for an identical
        member, and a caller still needs to know how much of the configuration matched without
        paying for the rows. So `summary.unchanged` does **not** always equal
        `byKind['member-unchanged']`; with `includeUnchanged=false` the latter is `0`.

        `byKind` is **pre-seeded with all five kinds at zero**, unlike the pull's summary, which
        carries only the kinds it observed. A comparison is read by a client rendering a fixed set
        of counters, and an absent key would make every one of them a null check.

        Counts are always over the **whole** comparison, on every page.

        ## Ordering and paging

        Entries are ordered by **breadcrumb path, then find number, then child item id, then kind**,
        with `entryId` last purely as a total-order guarantee. A deliberate divergence from the
        pull's `entryId`-hash order: a pull preview is read as a flat decision list, while a
        comparison is read against a tree, and hash order scatters siblings.

        Entries come in pages of `limit` (default 200); follow `page.nextCursor` for the rest. Each
        page continues after the last entry the previous page returned, and the set of positions is
        fixed by the state the first page resolved. A Draft row's quantity or find number edited in
        place between pages shows its newer value on later pages. Because entries are ordered by
        path and find number, a find number edited in place, or an item renamed, between pages can
        move an entry across the page boundary, so that one entry may be skipped or repeated;
        without such an edit, none is. The default page size is **not**
        raised by `includeUnchanged=true`, deliberately: a 500-edge BOM comes back over three
        pages rather than as one response an order of magnitude larger than the caller expected.

        Each entry names the left side's row in `target.rowKey`, the same key the left side's tree
        read uses, so a client can show the entry in the tree. It is null for `member-added` (the
        left side has no such row) and for `root-version-differs`.

        To see the same differences laid over the tree itself, read the left side's tree with
        `compare=` (see the [branch tree read](#operation/getBranchTree)). Both use one join, so
        they always agree.

        ## Access

        **Gated on read, not write** — deliberately unlike
        [pull-preview](#operation/previewMbomPull), which requires the same write grant the commit
        does because previewing a pull is initiating one. A comparison initiates nothing, and
        refusing a read-only user the ability to *look* at a difference has no justification.

        Each side is gated on the object it is addressed by: `Branch__c` for a branch,
        `Baseline__c` **and** `Branch__c` for a baseline, `Branch_Source__c` for a source,
        `Item_Revision__c` for an eBOM revision.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/RightKind'
        - $ref: '#/components/parameters/RightId'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/RightAsOf'
        - $ref: '#/components/parameters/IncludeUnchanged'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 'The comparison. An identical pair is a `200` with `identical: true`, not an empty response and not an error.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
              examples:
                identical:
                  summary: A branch against its own source — no differences
                  $ref: '#/components/examples/ComparisonIdentical'
                differences:
                  summary: A branch against a newer released eBOM revision
                  $ref: '#/components/examples/ComparisonWithDifferences'
                includingUnchanged:
                  summary: The same comparison with `includeUnchanged=true`
                  $ref: '#/components/examples/ComparisonIncludingUnchanged'
                paged:
                  summary: The same comparison at `limit=2`
                  $ref: '#/components/examples/ComparisonPaged'
        '400':
          description: |
            `INVALID_REQUEST` — `rightKind` is missing or is not one of the four values;
            `rightId` was not supplied; `limit` is not a positive integer up to 2000 (`limit=0` is
            refused, **not** silently defaulted); `cursor` was not issued by this endpoint; or
            `rightAsOf` was supplied for a baseline right side, which resolves at its own recorded
            timepoint and could not honour a different one.

            `ASOF_INVALID` / `ASOF_IN_FUTURE` — either clock could not be parsed, or names a moment
            that has not happened.

            An unrecognised `includeUnchanged` is **not** an error — see that parameter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                unknownRightKind:
                  value:
                    code: INVALID_REQUEST
                    message: 'That request could not be read. Check that the body is valid JSON and that every required value is supplied. (rightKind must be one of {baseline, branch, ebom, source}, not revision)'
                zeroLimit:
                  value:
                    code: INVALID_REQUEST
                    message: 'That request could not be read. Check that the body is valid JSON and that every required value is supplied. (limit 0)'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            `NOT_FOUND` — the path id names no branch or names another object; `rightId` names
            nothing, or names an object other than the one `rightKind` implies; or the path
            carries an unrecognised trailing segment (`.../comparison/junk`).

            A **missing** `rightId` is a 400 and a **present but unusable** one is a 404: the
            first is half a request, the second names a resource that is not there.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                rightIdWrongObject:
                  value:
                    code: NOT_FOUND
                    message: 'That record does not exist, or you do not have access to it. (a1Cg8000000AbCeEAK is not a Branch__c)'
        '409': { $ref: '#/components/responses/ComparisonConflict' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '422': { $ref: '#/components/responses/ComparisonUnprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mbom/baselines/{baselineId}/comparison:
    get:
      tags: [Comparison]
      operationId: compareBaseline
      summary: Compare a baseline against another configuration
      description: |
        The same comparison as [`compareBranch`](#operation/compareBranch) — same right-hand types,
        same kinds, same summary, same paging — with a **baseline** on the left instead of a
        branch. `target.rowKey` names the row of the baseline's own tree read.

        It exists because a baseline has to be able to sit on the left as well as the right: "what
        has this branch done since we froze it?" and "what changed between these two builds?" are
        both baseline-rooted questions, and neither can be asked by naming the baseline on the right
        alone.

        ## `asOf` is refused here, not ignored

        The left side is a baseline, so it resolves at the boundary its cut recorded. A second
        clock has nothing to answer, and accepting one would let a caller believe they had asked a
        temporal question and been given a temporal answer. Sending `asOf` is a
        `400 INVALID_REQUEST` — the same reading
        [`getBaselineTree`](#operation/getBaselineTree) takes. `rightAsOf` is still accepted,
        unless the *right* side is a baseline too.

        There is deliberately **no** `sources/{id}/comparison` and no eBOM-rooted left side. Both
        can still be compared — as the right-hand side of a branch or baseline — and eBOM against
        eBOM is already served by Propel's existing BOM Compare, which a third surface would
        duplicate.

        ## Access

        Read, not write, exactly as the branch-rooted endpoint. A baseline side is gated on
        `Baseline__c` **and** `Branch__c`, because reading one resolves the branch behind it.
      parameters:
        - $ref: '#/components/parameters/BaselineId'
        - $ref: '#/components/parameters/RightKind'
        - $ref: '#/components/parameters/RightId'
        - $ref: '#/components/parameters/RightAsOf'
        - $ref: '#/components/parameters/IncludeUnchanged'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the comparison, in the shape `compareBranch` returns — `left.kind` is `baseline`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
        '400':
          description: |
            `INVALID_REQUEST` — everything `compareBranch` refuses, **plus `asOf`**, which a
            baseline left side cannot honour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
              examples:
                asOfRefused:
                  value:
                    code: INVALID_REQUEST
                    message: 'That request could not be read. Check that the body is valid JSON and that every required value is supplied. (asOf cannot be supplied for a baseline: a baseline resolves at its own recorded timepoint, and honouring a different one would not be that baseline)'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` — the path id names no baseline, `rightId` names nothing or the wrong object, or the path carries a trailing segment.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '409': { $ref: '#/components/responses/ComparisonConflict' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '422': { $ref: '#/components/responses/ComparisonUnprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

# ======================================================================== components

components:

  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        Standard Salesforce OAuth 2.0 access token or session id, sent as
        `Authorization: Bearer <token>`.

  parameters:

    BranchId:
      name: branchId
      in: path
      required: true
      description: |
        Id of the `Branch__c`. Returned as `branchId` from `POST /mbom/mboms`.

        A malformed id, or a well-formed id of the wrong object, is a **404** — not a 500 and not a
        403. The URI is what names the resource, so a path naming nothing is a path to nothing, and
        the two tree endpoints therefore cannot be confused for each other by a caller that swaps a
        branch id for a source id.
      schema: { $ref: '#/components/schemas/SalesforceId' }

    SourceId:
      name: sourceId
      in: path
      required: true
      description: |
        Id of the `Branch_Source__c`. Returned as **`sourceId`** from `POST /mbom/mboms`.

        In this version a branch has exactly one source, an eBOM source. A source already names its
        owning branch, which is why there is no separate `branchId` segment on these paths.
      schema: { $ref: '#/components/schemas/SalesforceId' }

    BaselineId:
      name: baselineId
      in: path
      required: true
      description: Id of the `Baseline__c`, returned from the cut.
      schema: { $ref: '#/components/schemas/SalesforceId' }

    AsOf:
      name: asOf
      in: query
      required: false
      description: |
        The **branch** clock for this read. Defaults to the server clock when omitted; a future value
        is `ASOF_IN_FUTURE` (400).

        Governs the branch's own deltas, local content and substitutes. It does **not** govern
        `base` content, which always resolves at T_R — that is the two-clock model, and passing
        `asOf` to the source traversal is the single change that would quietly make a pinned MBOM
        float.

        Accepts ISO-8601 (`2026-02-01T00:00:00Z`, `2026-02-01T00:00:00+05:30`) and the
        space-separated form (`2026-02-01 03:04:05`, interpreted as GMT). A `+` offset is
        repaired server-side after query-string decoding turns it into a space, so a legal ISO offset
        does not fail in transport.
      schema:
        type: string
        format: date-time
      examples:
        iso: { value: '2026-02-01T00:00:00Z' }

    ParentRowKey:
      name: parentRowKey
      in: query
      required: false
      description: |
        Read beneath this row instead of beneath the root: its children (`depth=1`) or its whole
        subtree. The row itself is not returned. Use a `rowKey` exactly as a tree read issued it;
        never compose or parse one.

        A key that names no row in the state being read is `404 NOT_FOUND`. A key stays valid
        across snapshots while its occurrence exists. Ignored beside `cursor`.
      schema:
        type: string
        maxLength: 1024
      examples:
        level2: { value: 'a0Bg8000000Ab10.a0Bg8000000Ab31' }

    Depth:
      name: depth
      in: query
      required: false
      description: |
        How many levels below the root (or below `parentRowKey`) to return: a positive integer, or
        `all`. **Defaults to `all`**, so a request without `depth` returns the whole tree, paged. A grid expanding one level at a time sends `depth=1`.

        Anything else is `400 INVALID_REQUEST`. Ignored beside `cursor`.
      schema:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            const: all
        default: all

    TreeLimit:
      name: limit
      in: query
      required: false
      description: |
        The most rows (or lines) one page returns: 1 to 2000, **default 500**. Anything else is
        `400 INVALID_REQUEST`, never a silent fallback. A page may hold fewer rows than `limit` and
        still have `hasMore: true`; rely on `hasMore`, never on a short page.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 500

    ListLimit:
      name: limit
      in: query
      required: false
      description: |
        The most entries one page returns: 1 to 2000, **default 200**. Anything else is
        `400 INVALID_REQUEST`, never a silent fallback. Rely on `page.hasMore`, never on a short
        page.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 200

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        `page.nextCursor` from the previous page. The cursor carries the request it continues, so
        every other parameter except `limit` is ignored beside it, and the page continues the state
        the first one resolved; each endpoint says what an edit made between pages shows. Opaque; never expires; never parse it. A cursor this endpoint did
        not issue for this record is `400 INVALID_REQUEST`.
      schema:
        type: string

    Snapshot:
      name: snapshot
      in: query
      required: false
      description: |
        The `snapshot` a previous tree read of this record returned. The read then resolves exactly
        the rows that read did, even if the branch has been edited since, so children fetched
        later fit the rows already on screen. `asOf` is ignored beside it, because the snapshot
        carries its own.

        Without it, the read resolves the current state at `asOf`. A snapshot pins which rows exist
        and where they hang. A Draft row's quantity or find number edited in place since shows its
        newer value. A snapshot never expires. One this endpoint
        did not issue for this record is `400 INVALID_REQUEST`.
      schema:
        type: string

    Compare:
      name: compare
      in: query
      required: false
      description: |
        Adds a `redline` to every row, comparing this tree against a target:

        - `source` — what this branch's own source supplies (branch tree read only).
        - `baseline:{baselineId}` — a baseline, at its own recorded timepoint.
        - `branch:{branchId}` — another branch, now.
        - `ebom:{itemRevisionId}` — a released eBOM revision, at its release date.

        The target resolves exactly as the comparison's right side does with no `rightAsOf`. See
        the [branch tree read](#operation/getBranchTree) for what each redline status means. Any
        other form is `400 INVALID_REQUEST`; an id that names nothing, or the wrong object, is
        `404 NOT_FOUND`. Omitted, every row's `redline` is null.
      schema:
        type: string
        pattern: '^(source|baseline:[a-zA-Z0-9]{15,18}|branch:[a-zA-Z0-9]{15,18}|ebom:[a-zA-Z0-9]{15,18})$'
      examples:
        source: { value: source }
        baseline: { value: 'baseline:a1Fg8000000AbE1EAK' }

    RightKind:
      name: rightKind
      in: query
      required: true
      description: |
        What the **right-hand** side of the comparison is. Required — a comparison against nothing
        in particular is half a request, so a missing or unrecognised value is
        `400 INVALID_REQUEST`.

        - `branch` — another `Branch__c`, resolved with its own deltas overlaid.
        - `baseline` — a `Baseline__c`, replayed at the boundary its cut recorded.
        - `source` — a `Branch_Source__c`: what that source *supplies*, with no branch deltas
          folded in. This is the "what have I changed relative to upstream?" comparison.
        - `ebom` — a released `Item_Revision__c`, walked raw, with no branch in the picture.

        **Matched case-insensitively**, so `Branch` and `BRANCH` are both accepted. Send the
        lower-case spelling: that is the published value, and it is what comes back in
        `right.kind`.
      schema:
        $ref: '#/components/schemas/CompareSideKind'

    RightId:
      name: rightId
      in: query
      required: true
      description: |
        The record the right-hand side is. Its object must match `rightKind` —
        `Branch__c`, `Baseline__c`, `Branch_Source__c` or `Item_Revision__c` respectively.

        **Absent is a 400** (the caller described half a comparison); **present but naming nothing,
        or naming another object, is a 404** (the caller named a resource that is not there). The
        same split the path ids make.
      schema: { $ref: '#/components/schemas/SalesforceId' }

    RightAsOf:
      name: rightAsOf
      in: query
      required: false
      description: |
        The **right** side's read clock. `asOf` governs the left side; each side keeps its own pair
        of clocks and never borrows the other's, which is why there are two parameters rather than
        one. A branch read at now against a baseline frozen in March is two configurations at two
        instants, and both are published on the response.

        Defaults differ by side type — now for `branch` and `source`, and for `ebom` **that
        revision's own release date**, since a raw eBOM walk has no acceptance to pin it and "the
        eBOM of revision X" honestly means the eBOM as it stood when X was released.

        **Refused for a `baseline` right side** (`400 INVALID_REQUEST`), which resolves at the
        timepoint its cut recorded. Parsing and the future-value rule are `asOf`'s, unchanged.
      schema:
        type: string
        format: date-time
      examples:
        iso: { value: '2026-04-02T00:00:00Z' }

    IncludeUnchanged:
      name: includeUnchanged
      in: query
      required: false
      description: |
        Emit a `member-unchanged` entry for every correlation key present and identical on both
        sides, turning the response into the **complete merged BOM** — one entry per key across
        both sides, which is what a side-by-side tree renders from a single call.

        Defaults to `false`. **Only an explicit `true` (any case) turns it on**; anything else —
        `includeUnchanged=1`, `=yes` — falls back to the default rather than raising, because the
        fallback is the smaller response and loses no information: `summary.unchanged` carries the
        count either way.

        It costs no extra query. It does **not** raise the default `limit`, and it moves
        `summary.total` and `summary.byKind`, which count entries emitted — see the endpoint
        description.
      schema:
        type: boolean
        default: false

  # ---------------------------------------------------------------- schemas

  schemas:

    SalesforceId:
      type: string
      pattern: '^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$'
      description: A 15- or 18-character Salesforce record Id.
      examples: ['a1Bg8000000AbCdEAK']

    # -------------------------------------------------- shared vocabulary

    Provenance:
      type: string
      description: |
        Where a rendered row comes from. **Derived at read time, never stored** — `claiming` and
        `new` differ only in whether the branch's row took over a source line.

        The taxonomy has two axes — whether a record exists upstream, and whether the branch has
        taken it over:

        | | exists upstream (*source*) | has a branch record (*native*) |
        |---|---|---|
        | untouched | `base` | — |
        | taken over | — | `claiming` |
        | branch only | — | `new` |

        - `base` — supplied by the source; no branch-owned record exists.
        - `claiming` — a branch row that takes over a source row (copy-on-write ownership).
        - `new` — branch-owned with no upstream counterpart ("native").
        - `nested` — a descendant of a locally added or substituted assembly, rendered from that
          item's own eBOM; or a descendant of a **pinned** row whose chosen
          revision differs from its source line's, rendered from the pinned revision's eBOM in
          place of the source's lines. Read-only: every row in such a subtree carries
          `isEditable: false`, and the pull diff excludes them entirely. Appears on tree rows only,
          never in a diff entry's `MemberState`.

        There is no `excluded` value: exclusion is tracked as a separate boolean alongside
        provenance, never as a value of it. Nor is there a `claimed` value for a source row some
        branch has taken over: that answer is branch-relative, so a source read with no branch
        could not give it.
      enum: [base, claiming, new, nested]

    GoverningClock:
      type: string
      description: |
        Which clock resolves this member. `source` is the pinned T_R (it only advances when a pull is
        committed); `branch` is the caller's `asOf`. Both are legitimately in play at once, which is
        what makes mixed revisions of one item possible.
      enum: [source, branch]

    CiKind:
      type: string
      description: |
        Discriminator for the configuration-item type, and therefore for the shape of
        `MemberState.detail`. `assembly-edge` is the only member type implemented; this enum is the
        extension point where a future CI type is added.

        `source` appears only on the root-level `source-version-advance` entry's `target` (and on the
        root segment of every `path[]`), because that entry is about the source's root **item**
        rather than an edge beneath it: it has no parent, no quantity and no find number.
      enum: [assembly-edge, source]

    # -------------------------------------------------- create

    MbomCreateRequest:
      type: object
      required: [rootItemRevisionId, mbomName, branchLabel]
      properties:
        rootItemRevisionId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: |
            The **released** `Item_Revision__c` the MBOM is built over. Its `Released_Date_Time__c`
            becomes T_R.
        mbomName:
          type: string
          maxLength: 80
          description: |
            `MBOM__c.Name`. Required: a blank value is refused with `INVALID_REQUEST`, because an
            MBOM with a blank name would be named after its own record id, which nobody can search
            for.
          examples: ['Assy-100 Manufacturing BOM']
        branchLabel:
          type: string
          maxLength: 80
          description: |
            The branch's name, shown in every Salesforce list view and lookup, and its label.
          examples: ['MBOM-GDL']

    MbomCreateResult:
      type: object
      required: [mbomId, branchId, sourceId, sourceRevisionId]
      properties:
        mbomId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The `MBOM__c` header.
        branchId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The initial `Branch__c`. Use it on every `/branches/...` endpoint.
        sourceId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: |
            The `Branch_Source__c` linking the branch to its eBOM. **This is the `sourceId`** on
            every `/sources/...` endpoint.
        sourceRevisionId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The first acceptance (`Branch_Source_Rev__c`), which carries T_R.

    # -------------------------------------------------- trees

    StructureTree:
      type: object
      description: The response body of the branch and source tree reads — one page of a branch's effective structure, or of a source's structure on its own.
      required: [rootRevisionId, snapshot, parentRowKey, rows, warnings, page]
      properties:
        asOf:
          type: string
          format: date-time
          description: The timepoint this tree was resolved at, echoed so the response is self-describing. Present even when the caller sent none, and taken from the `snapshot` when one was sent.
        rootRevisionId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The root `Item_Revision__c` the structure hangs from.
        sourceTimePoint:
          type: string
          format: date-time
          description: '**T_R** — the source timepoint `base` rows resolve at.'
        snapshot:
          type: string
          description: |
            Opaque name of the state this page resolved. Send it with child and page requests that
            belong to the same view; see the `snapshot` parameter. Never parse it.
          examples: ['s1.MjAyNi0wNC0wNVQxNzoyMjowM1p8NDI']
        parentRowKey:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The `parentRowKey` this page was read beneath; null for a read from the root.
        compareTarget:
          oneOf: [{ $ref: '#/components/schemas/ComparisonSide' }, { type: 'null' }]
          description: What `compare` compared against, described as a comparison describes its right side. Null without `compare`, and always null on a source tree read.
        rows:
          type: array
          description: One page of rows in depth-first pre-order. Always present; empty rather than absent.
          items: { $ref: '#/components/schemas/TreeRow' }
        warnings:
          type: array
          description: |
            Warnings about **rows in this page** only, each naming its row by `rowKey`. Always
            present; empty rather than absent. Whole-configuration warnings are on the findings.
          items: { $ref: '#/components/schemas/TreeWarning' }
        page: { $ref: '#/components/schemas/PageInfo' }

    PageInfo:
      type: object
      description: Where this page sits in the whole answer. There is deliberately no total count.
      required: [limit, hasMore, nextCursor]
      properties:
        limit:
          type: integer
          description: The effective page size — the `limit` sent, or the default.
          examples: [500]
        hasMore:
          type: boolean
          description: True when another page follows. The only end-of-data signal; a short page is not one.
        nextCursor:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Send as `cursor` for the next page. Null exactly when `hasMore` is false. Opaque.
          examples: ['c1.YTBCZzgwMDAwMDBBYjEyfDUwMA']

    RowRedline:
      type: object
      description: |
        How a row differs from the `compare` target — read as **this tree against the target**.
        See the branch tree read for the full rules.
      required: [status, changedFields, oldValues, entryId]
      properties:
        status:
          type: string
          enum: [added, removed, modified, unchanged]
          description: |
            - `added` — this tree has the row; the target does not.
            - `removed` — the target has the row; this tree does not (rendered from the target,
              under every occurrence of its parent item in this tree), or this tree excluded it.
            - `modified` — both have it, and `changedFields` differ.
            - `unchanged` — both have it, identical.
        changedFields:
          type: array
          description: On `modified`, which of the three assertable values differ, in this fixed order; empty otherwise.
          items:
            type: string
            enum: [quantity, findNumber, childRevision]
        oldValues:
          type: object
          description: On `modified`, the **target's** value of each changed field, keyed `quantity`, `findNumber` and `childItemRevisionId`; empty otherwise.
          additionalProperties: true
          examples:
            - { quantity: 2 }
        entryId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The `entryId` the comparison of the same pair gives this position, so the redline and the change list can be linked. Null on `unchanged` rows and on `REDLINE_AMBIGUOUS` rows. A row beneath a `removed` row is itself `removed`; it carries the comparison's entry for its position when the comparison reports that position as `member-added`, and is null when the comparison pairs that position elsewhere in this tree.

    TreeRow:
      type: object
      description: |
        One row of a resolved tree: one occurrence of one BOM line. Rows carry their own place in
        the tree (`rowKey`, `parentRowKey`, `level`), so a client rebuilds the tree from any set of
        pages by `parentRowKey`, and never by item id — one item can appear at several places.
      required: [rowKey, parentRowKey, level, hasChildren, provenance, warningCodes]
      properties:
        rowKey:
          type: string
          maxLength: 1024
          description: |
            Opaque, server-issued identity of this occurrence. It encodes the path from
            the root, so two occurrences of one item have two keys. URL-safe, at most 16
            characters per level, and **stable** across edits and snapshots while the occurrence
            exists. A pull that accepts a new root revision replaces the source's BOM lines, so
            it ends the occurrences that follow them: base rows, and claimed rows that follow
            their source line, come back with new keys, while rows the branch added itself keep
            theirs. Send it as `parentRowKey` to read beneath this row. Never compose or parse it.
          examples: ['a0Bg8000000Ab10']
        parentRowKey:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The `rowKey` of the row this one hangs beneath; **null for the root's children** (level 1).
        level:
          type: integer
          minimum: 1
          description: Depth below the root — 1 for the root's children.
        hasChildren:
          type: boolean
          description: True when reading beneath this row would return at least one row. Under `compare`, true when either side has children.
        ciId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: |
            The `CI__c` the branch holds for this row — the id `exclude`, `restore`, `revert` and
            `convert-to-native` take. **Null for a `base` row**, which has no branch
            record, for a `nested` row, and on source and baseline rows.
        warningCodes:
          type: array
          description: |
            The codes of the row-level warnings about this row: `STORED_REVISION_RETIRED`,
            `MEMBER_ADD_COLLISION`, `PINNED_SUBTREE_HIDES_EDITS`, `NESTED_CYCLE_PRUNED`,
            `REDLINE_AMBIGUOUS`. The full warning is in the response's `warnings`. Always present;
            empty rather than absent.
          items: { type: string }
        redline:
          oneOf: [{ $ref: '#/components/schemas/RowRedline' }, { type: 'null' }]
          description: How this row differs from the `compare` target. Null without `compare`.
        edgeId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: The `Assembly_CI__c` edge. **Null for a `base` row** that no branch has claimed. Suppressed on baseline rows.
        edgeKey:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            The eBOM `Assembly__c` line id, or a synthetic key for branch-local content:
            `new-{branchId}-{parentItemId}-{childItemId}` for an `add`, or
            `replaces-{branchId}-{supersededEdgeKey}-{newChildItemId}` for a substitute. Suppressed
            on baseline rows.

            An edge key is identity and is never re-stamped. Treat it as opaque; never parse the
            prefix.

            A substitute always carries its own `replaces-…` key, even when its child item already
            has its own line under the same parent: the two render as two rows, each under its own
            key (see the branch tree read).
          examples: ['a0Bg8000000Ab10EAC']
        detail:
          $ref: '#/components/schemas/AssemblyEdgeDetail'
        provenance: { $ref: '#/components/schemas/Provenance' }
        governingTimestamp:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            T_R for a `base` row; `asOf` for every other row — `claiming`, `new` and `nested`.

            A `claiming` row answers to `asOf` because this one field also governs the branch's own
            quantity and find number, so it does not always name the clock that chose the row's
            child revision (see `AssemblyEdgeDetail.childItemRevisionId`).

            **On a baseline row it is collapsed, not suppressed:** every row carries the baseline's
            own `resolutionTimePoint`. A frozen record honours exactly one timepoint, so a per-row
            clock there would imply the reader could re-resolve at it — but the value is stated
            rather than nulled, so one client code path renders baseline and tree rows alike.
        sourceId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: The `Branch_Source__c` this row came from. Null for a branch-local row.
        isClaimed: { type: boolean }
        isExcluded:
          type: boolean
          description: |
            True for a tombstoned row. **Rendered by the branch tree read** so the editor can see
            what was removed; **filtered out** by the baseline read.
        isReplaced:
          type: boolean
          description: True when this row stands in for another (`replace`). Populated on baseline rows too — a null would render a substituted part identically to an ordinary one.
        isEditable:
          type: boolean
          description: |
            False on any row inside the subtree of a locally added or substituted assembly, or of a
            row pinned to a revision other than its source line's. Every delta op
            refuses those rows with `NOT_EDITABLE`, so a UI offering an action on one is offering an
            action the API will reject.
        isCollapsedCollision:
          type: boolean
          description: |
            True when one BOM position is asserted by both the branch and its source and the two
            render as a single row, with the branch's content winning. A tree read carries a
            `MEMBER_ADD_COLLISION` warning alongside it.

            Defaults to `false`. Populated on baseline rows too, where — because a baseline
            forwards drift warnings only — it is the sole signal of the collapse.
        hasChosenRevision:
          type: boolean
          description: |
            True when this row stores a child revision somebody **chose**: an `add`
            or `replace` that sent `childItemRevisionId`, a `claim` that pinned, a
            `convert-to-native` that stamped, or an `update` that pinned. Never null. This is
            what "pinned" means in this API.

            It follows the explicit choice only, never what the row happens to render:

            - A tracking claim or a floating row is `false`, even when it resolves to exactly the
              revision a pin would have named.
            - A pin **equal** to its source line's revision is `true`, although it renders no
              pinned structure.
            - A floating `new` row that renders a pinned structure because the read clock moved
              past T_R is `false`: nobody chose it.
            - Tombstones, `nested` rows and every row of a source tree are `false`.

            The structural sense — a held revision that differs from its source line's, rendering
            that revision's structure — is a different signal, surfaced only through
            `PINNED_SUBTREE_HIDES_EDITS` and `isEditable` on the rows beneath. Never derive one from
            the other. Populated on baseline rows too.
        wasClaimed:
          type: boolean
          description: |
            True on a `new` row that once claimed a source row, and that `convert-to-native`
            flipped from `claiming` to `new`. The provenance says the row is the
            branch's own now. This says it did not start that way, which an audit of a released
            configuration needs to see. Never null.

            `false` on a row that claims now, so it is never combined with `isClaimed`, and on a
            read dated before the conversion. A display fact about one row's history,
            deliberately **not** a provenance value. Populated on baseline rows too, evaluated as of
            the baseline's own timepoint. Every convert makes a stamp-or-track choice, so a
            `wasClaimed` row may or may not have `hasChosenRevision`.
        revisionChosenById:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: |
            The user Id of the creator of the branch revision (`CI_Rev__c`) the row resolves
            through. Populated wherever `hasChosenRevision` is true — on live tree reads
            and baseline rows alike — and null wherever it is false.

            It is not always "who first chose the revision": an `update` edits a Draft revision in
            place, keeping the original author, but forks a Frozen one, and the fork names the user
            who made it — even if that `update` changed only the quantity and carried the pin
            forward.
        revisionChosenAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            When that branch revision was created, to the whole second. Null exactly
            where `revisionChosenById` is.

    TreeWarning:
      type: object
      description: |
        A condition worth telling the user about that does **not** block the read. Shared by the tree
        reads, the findings, the pull preview and the comparisons.

        A tree read carries only the warnings about the rows it returns; the
        [findings](#operation/getBranchFindings) carry every warning about the whole configuration.

        The key is **`warningCode`**, matching the existing mBOM convention — never `code`, which
        this API reserves for the error body.
      required: [warningCode, message]
      properties:
        warningCode:
          type: string
          enum: [MIXED_REVISION, BASELINE_COUNT_DRIFT, BASELINE_PROVENANCE_DRIFT, NESTED_CYCLE_PRUNED, PINNED_SUBTREE_HIDES_EDITS, MEMBER_ADD_COLLISION, COMPARE_ROOTS_DIFFER, BASELINE_PIN_DRIFT, STORED_REVISION_RETIRED, REDLINE_AMBIGUOUS]
          description: |
            The complete vocabulary.

            - `MIXED_REVISION` — one item rendered at more than one revision in the same tree,
              because two clocks are in play. Legal and expected; warned, never blocked. Each
              occurrence renders its own revision's structure. A whole-configuration finding: on
              the branch findings, the pull preview and a comparison's sides, never on a tree
              read, whose page may hold only one of the revisions.
            - `BASELINE_COUNT_DRIFT` — a baseline re-derived a different **row count** than its cut
              recorded.
            - `BASELINE_PROVENANCE_DRIFT` — a baseline re-derived a different number of **`claiming`**
              rows than its cut recorded. Separate from the count drift because severing a claim
              moves no row: the same rows come back, one of them no longer a claim.
            - `NESTED_CYCLE_PRUNED` — the structure of a locally added or substituted assembly, or
              of a pinned revision, was dropped because walking it reached a cycle. The rest of the
              tree is still returned; when pins were involved it falls back to the unsuppressed
              source structure, and raises no `PINNED_SUBTREE_HIDES_EDITS`.
            - `PINNED_SUBTREE_HIDES_EDITS` — some of the branch's edits take no effect,
              because a pinned row's own revision structure replaced the source lines they sit on:
              a claim, exclusion, update or substitute on a suppressed line (and on no line still
              rendered elsewhere), or an `add` under an item only the suppressed structure
              supplied. Not raised for an exclusion of a line upstream has already removed (what
              `remove` leaves on a `claim-orphaned` line): it removes nothing that exists.
              Rendered, never refused. Raised once per pinned row and hidden item: on the branch
              tree read (on the pinned row, whose `rowKey` it carries, with the hidden item in
              `itemId`), on the findings, and on the pull preview, where it describes
              the tree **after** the commit (with no optional decision taken).
              The remedy is an `update` on the pinned row: clear it with
              `trackChildRevision: true`, or pin it to the source line's own revision. Either keeps
              the row's quantity and find number, and the hidden edits render again.
            - `MEMBER_ADD_COLLISION` — one BOM position was asserted by **both** the branch and its
              source, and the branch's content won. The two rows render as one, carrying
              `isCollapsedCollision: true`. Not raised once a pull has retired a *converged* local
              add, because only the source asserts the position from then on.
            - `COMPARE_ROOTS_DIFFER` — a comparison's two sides are rooted at different **items**,
              so they have no members in common and every entry is an addition or a removal for
              that reason alone. The comparison still answers; refusing would be the wrong call for
              a read. Comparison responses only, where it is reported on **`leftWarnings`** — it is
              about the pair rather than either side, the response has two warning lists and no
              third, and the left is the side the caller addressed by path. It carries no `itemId`
              and no revisions: there is no single item it is about, and `left` / `right` already
              publish both roots.
            - `BASELINE_PIN_DRIFT` — a baseline re-derived a different number of rows
              **holding a chosen revision** (`hasChosenRevision`) than its cut recorded. The count
              covers contained members, excluding tombstones, `nested` rows and edits hidden behind
              a pin. It catches a revision decision moving where no row count or claim count moved.
              Raised only where a baseline is re-resolved: the baseline findings, and a
              comparison's baseline side. It carries no `itemId` and empty arrays, like the other
              drift codes.
            - `STORED_REVISION_RETIRED` — a row's explicitly stored child revision (a
              pinned `add` / `replace`, a pinned claim, a stamped `convert-to-native`, a pinning
              `update`) has since been **Cancelled or Expired**. The row still renders that
              revision: nothing is substituted, and the read does not fail. `message` is the Custom
              Label `CM_Warn_STORED_REVISION_RETIRED`.

              One warning per row, not deduplicated by item, in a deterministic order. `itemId` is
              the row's child item and `itemRevisionIds` holds exactly the stored dead revision.
              Never raised by a row that stores no revision (a tracking claim or convert, a floating
              `new` row), by a tombstone, or by an edit hidden behind a pin. On a dead pin with
              nested structure, it names the pinned row, not the rows beneath it. A user who cannot
              see the stored revision under sharing gets no warning. Raised on the branch tree read
              (on the row), on the branch findings, and on both sides of a comparison (branch and
              baseline sides); **not** on the baseline tree read or the pull preview.
            - `REDLINE_AMBIGUOUS` — under `compare`, the correlation join could not tell
              which row of this tree pairs with which row of the target at one position, so the
              rows are shown unpaired (`added` and `removed`) instead of refusing the read. One
              warning per such row, carrying its `rowKey`. The
              [comparison](#operation/compareBranch) of the same pair answers
              `422 AMBIGUOUS_CORRELATION` and its remedies apply. Tree reads with `compare` only.
        message:
          type: string
          description: Human-readable, from a Custom Label. Translated; never parse it.
        rowKey:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            The row the warning is about, on a tree read and on the findings:
            `STORED_REVISION_RETIRED`, `MEMBER_ADD_COLLISION`, `PINNED_SUBTREE_HIDES_EDITS` (the
            pinned row), `NESTED_CYCLE_PRUNED` and `REDLINE_AMBIGUOUS`. Null on `MIXED_REVISION`,
            the drift codes and `COMPARE_ROOTS_DIFFER`, and on every pull-preview and comparison
            warning.
        itemId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: |
            Present on `MIXED_REVISION` — the item rendered at more than one revision — on
            `MEMBER_ADD_COLLISION`, naming the child item whose position collapsed, and on
            `PINNED_SUBTREE_HIDES_EDITS`, naming the child item of the edited line a pinned
            revision's structure replaced (or, on a pull preview, will replace), and on
            `STORED_REVISION_RETIRED`, naming the child item of the row holding the dead revision.
            Null on the drift codes and `COMPARE_ROOTS_DIFFER`.
        itemRevisionIds:
          type: array
          description: |
            Present on `MIXED_REVISION` — the revisions in play — and on
            `PINNED_SUBTREE_HIDES_EDITS`, where it holds the revision of the pinned row whose
            structure hid the edit (that row's `detail.childItemRevisionId`), with
            `governingTimestamps` left empty; and on `STORED_REVISION_RETIRED`, where it holds
            exactly one id, the Cancelled or Expired stored revision, with `governingTimestamps`
            left empty. Every other code leaves it empty.
          items: { $ref: '#/components/schemas/SalesforceId' }
        governingTimestamps:
          type: array
          description: Present on `MIXED_REVISION` — the clock that governed each, positionally aligned with `itemRevisionIds`.
          items: { type: string, format: date-time }

    # -------------------------------------------------- deltas

    DeltaBatchRequest:
      type: object
      required: [operations]
      properties:
        atomic:
          type: boolean
          default: true
          description: |
            All-or-nothing when true. **A null is treated as `true`** — the safer contract wins the
            default, so a caller who did not think about the failure mode gets all-or-nothing rather
            than a half-applied branch.
        asOf:
          type: string
          format: date-time
          description: |
            Resolves the branch **once** for the whole batch; every operation then validates against
            that one snapshot, so a batch cannot see the tree shift underneath it halfway through.

            Defaults to the server clock; never accepted in the future. A **past** value means
            "validate against the configuration as it stood then" — it never dates the write. Several
            operations refuse a past value outright; see the endpoint description.
        operations:
          type: array
          maxItems: 200
          description: At most 200 — beyond that, `BATCH_TOO_LARGE` (413), refused before anything is resolved.
          items: { $ref: '#/components/schemas/DeltaOperation' }

    DeltaOperation:
      type: object
      description: |
        One operation. The shape is a **union across all eight operations** rather than a separate shape per
        operation, because the batch arrives as one JSON array. `op` selects which fields are
        meaningful, and each operation validates its own required fields — an `add` with no
        `parentItemId` is that operation's error to raise, not a deserialisation failure.

        Unknown keys are **silently ignored** (the deserialiser is lenient), so a *mistyped* field
        name reads as a null id. `rootItemRevisionld` with an `l` will answer `NOT_FOUND`, not a
        schema error.
      required: [op]
      properties:
        op:
          type: string
          enum: [claim, update, add, exclude, restore, replace, revert, convert-to-native]
          description: |
            Matched case-insensitively. An unknown value is a **per-operation** validation failure (`INVALID_REQUEST`), not an exception — one mistyped name in a batch of 200 must not read as a server fault.

            There is no `set-revision`: changing or clearing a stored revision is an `update`.
            `set-revision` answers `INVALID_REQUEST` (`unknown op set-revision`).
        clientRef:
          type: string
          description: |
            Opaque caller token, echoed verbatim on this operation's result. Set it to correlate
            results with a UI row; the server never interprets it. Correlating on order alone breaks
            the moment anything is reordered, and on `clientRef` alone breaks when you do not set it
            — so `index` is stated too.
          examples: ['row-motor']
        ebomAssemblyId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: |
            The eBOM `Assembly__c` line. Used by: `claim`, `exclude`, `update` (the `CLAIM_REQUIRED` path, and the `autoClaim` path), `revert` (the second-revert path).

            Never finds a row hidden behind a pin: an `update` addressed by it answers `NOT_FOUND`
            there.
        assemblyCiId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: |
            An existing `Assembly_CI__c` edge to `update`. The ordinary form.

            The **request** keeps this name while the result publishes the same id as `edgeId`.
            Not an oversight: a request carries every operation's fields in one flat shape, and
            the operation an id belongs to is known only after `op` is read — so a request field
            cannot be grouped per configuration-item type the way a response's can.

            It also finds a row hidden behind a pin, which `ebomAssemblyId` never does.
        ciId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: 'A `CI__c` to `exclude`, `restore`, `revert` or `convert-to-native`.'
        parentItemId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: '`add` only — the parent **item** (never a revision).'
        childItemId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: '`add` only — the part being added.'
        replacedEbomAssemblyId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: '`replace` only — the eBOM line being superseded. Must be an eBOM-derived row; a branch-local row cannot be replaced.'
        newChildItemId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: '`replace` only — the substitute part. Its revision **floats** at the read clock unless `childItemRevisionId` pins it.'
        quantity:
          type: number
          description: |
            Used by `update`, `add`, `replace`. On `update`, omitted keeps the row's value, and
            ≤ 0 answers `INVALID_REQUEST` (use `exclude` to remove a row).
        findNumber:
          type: number
          description: |
            Used by `update`, `add`, `replace`. On `update`, omitted keeps the row's value.
        childItemRevisionId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: |
            An explicit child `Item_Revision__c` for the row this operation creates, takes over or
            revises — `add`, `replace`, `claim`, `convert-to-native` and `update`. Ignored on every
            other operation.

            A value means "use exactly this revision, whatever the clock says": a deliberate pin,
            never a default. It must be a revision **of the operation's child item** — the claimed
            line's child for `claim`, the substitute for `replace`, the converted row's child for
            `convert-to-native` — or the operation answers `422 REVISION_ITEM_MISMATCH` (also the
            answer for an id naming no revision you can see).

            - On `add` and `replace`, **blank means track**, and is the default: the row floats at
              the read clock.
            - On `claim` and `convert-to-native`, blank is **not a choice on its own**: send either
              this or `trackChildRevision: true` — exactly one — or the operation answers
              `422 REVISION_CHOICE_REQUIRED`.

            There is no server-side "pin current". To pin what the tree shows, or to have a convert
            keep what it shows, send back that row's `detail.childItemRevisionId`.

            - On `update` of an owned row, it **pins** the row to this revision, validated against
              the row's own child item. One different from the revision the row **stores** is a
              revision change and always forks; an equal one changes nothing. Omitted (or null)
              keeps the stored revision — clearing is `trackChildRevision: true`, never a null
              here.
            - On `update` with `autoClaim: true` of a `base` edge, it pins the claim the update
              performs.
            - Sent together with `trackChildRevision: true` on `update`:
              `422 REVISION_CHOICE_REQUIRED`.
          examples: ['a0Ag8000000Ab31EAC']
        trackChildRevision:
          oneOf: [{ type: boolean }, { type: 'null' }]
          description: |
            `claim`, `convert-to-native` and `update`: `true` stores **no** revision.
            `false` and null both mean "not chosen".

            - On `claim`, the row **follows the source**: it keeps rendering exactly the revision its
              unclaimed self would, at the accepted source's T_R, and moves when a pull accepts a
              newer source. It does not float at the read clock.
            - On `convert-to-native`, the row has no source left to follow, so it **floats at the
              read clock**, exactly like an `add`.

            - On `update` of an owned row, `true` **clears** the stored revision: a
              cleared claim follows its source line at T_R, a cleared `new` row or substitute floats
              at the read clock. Clearing a row that stores a revision always forks; clearing one
              that stores none changes nothing. **It does clear a pin** — a client that sends
              `trackChildRevision: true` on every `update` will un-pin every pinned row it touches.
            - On `update` with `autoClaim: true` of a `base` edge, `true` claims and tracks.

            `claim` and `convert-to-native` must carry exactly one of this (`true`) and
            `childItemRevisionId`; neither, or both, is `422 REVISION_CHOICE_REQUIRED`. `update`
            may carry neither (keep), but both is `422 REVISION_CHOICE_REQUIRED`. **Ignored, not
            refused, on every other operation** — `add` and `replace` already track when
            `childItemRevisionId` is blank, and refusing it would make one shared client payload
            shape invalid for them.
        autoClaim:
          oneOf: [{ type: boolean }, { type: 'null' }]
          description: |
            `update` only. When `true`, an update of a `base` edge **claims it and
            revises it in one operation**, instead of answering `409 CLAIM_REQUIRED` — otherwise
            two requests, because a batch validates every operation against one pre-batch
            snapshot.

            - **The implicit claim makes the same revision choice `claim` does.** When the row is
              `base`, send exactly one of `trackChildRevision: true` or `childItemRevisionId`.
              `trackChildRevision: true` is the expected case: the row keeps following its source
              line. `childItemRevisionId` claims and pins. Neither answers
              `422 REVISION_CHOICE_REQUIRED` (checked after the row is looked up, so a missing row
              answers `NOT_FOUND` instead); both answers it on any row, before the lookup. There is
              no default, for the reason `claim` has none.
            - **No quantity or find number is needed** on a `base` row: `autoClaim` +
              `trackChildRevision: true` alone is a plain tracking claim with the line's own
              quantity and find number.
            - **The result reports the claim.** `DeltaResult.claimed` is `true` and `forked` is
              null (a claim's first revision is not a fork). `CLAIM_REQUIRED` would have disclosed
              the eBOM line before the fact; this discloses it after.
            - **On an edge the branch already owns**, the flag is a no-op: `claimed` stays null and
              the revision fields mean what they mean on any `update` — neither keeps the stored
              revision, `childItemRevisionId` pins (a different one forks), and
              `trackChildRevision: true` **clears** the stored revision. To keep whatever an owned
              row stores, omit both revision fields.
            - **It bypasses no other guard.** These all still refuse the operation:
              - `NOT_EDITABLE` on a nested row, `NOT_SUPPLIED` on an excluded one, `STALE_REVISION`
              - a non-positive quantity, or a second operation on the same edge in the batch
              - every guard `claim` applies: a past `asOf` on a `base` edge (`INVALID_REQUEST`),
                `REVISION_ITEM_MISMATCH`, and a membership change on the same row earlier in the
                batch. So `[replace(L, X), update(L, autoClaim)]` and
                `[claim(L), update(L, autoClaim)]` are refused `INVALID_REQUEST`.
              - On an edge the branch already owns, no claim happens, so a past `asOf` stays
                tolerated as on plain `update`.
            - A row hidden behind a pin is found by `assemblyCiId` only (it is owned, so the flag
              is a no-op there); by `ebomAssemblyId` it answers `NOT_FOUND`.

            `false` and null both mean off: `CLAIM_REQUIRED`, still carrying the eBOM line.
            Ignored, not refused, on every other operation.
          examples: [true]

    DeltaBatchResponse:
      type: object
      required: [branchId, atomic, asOf, applied, failed, results, snapshot, invalidatedParentRowKeys]
      properties:
        branchId: { $ref: '#/components/schemas/SalesforceId' }
        atomic:
          type: boolean
          description: Echoed, so the response says which contract it was written under.
        asOf:
          type: string
          format: date-time
          description: |
            The timepoint the whole batch resolved against. It matters more here than on a read — the
            caller may have sent none at all, and this is the only way to learn which server clock
            the batch actually used.
        applied:
          type: integer
          minimum: 0
          description: Count of operations that succeeded. Stated so a client can act on the summary without walking `results`.
        failed: { type: integer, minimum: 0 }
        results:
          type: array
          description: One entry per requested operation, **in request order**, success or failure.
          items: { $ref: '#/components/schemas/DeltaResult' }
        snapshot:
          type: string
          description: |
            The branch's state **after** this batch, as a tree read would name it.
            Read with it to see your own writes and nothing later. Present even when nothing was
            applied, naming the unchanged state.
          examples: ['s1.MjAyNi0wNC0wNVQxNzoyMjowNVp8NDM']
        invalidatedParentRowKeys:
          type: array
          description: |
            The `rowKey`s of rows whose children a client should read again, because a row beneath
            them was added, removed or changed by this batch. An empty string stands
            for the root. Empty when nothing was applied. Always present.
          items: { type: string }
          examples:
            - ['', 'a0Bg8000000Ab10']

    DeltaResult:
      type: object
      required: [index, op, success]
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based position of this operation in the request.
        clientRef:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Your own token, echoed verbatim. Null when you set none.
        op: { type: string }
        success: { type: boolean }
        errorCode:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            The error code on failure, null on success. Note the key is **`errorCode`** here, inside
            a per-operation result — the top-level *error body* uses `code`.

            The values are `RestError.code`'s vocabulary — that enum is the complete list. Left a
            plain string here so a code added to the vocabulary never makes a batch result fail
            validation in an older client.
        message:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Human-readable, from a Custom Label. Never parsed.
        ciId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: The `CI__c` this operation created or acted on.
        edgeId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: |
            The edge this operation created or acted on, in its CI type's own vocabulary — an
            `Assembly_CI__c` for the assembly type. The same value, under the same name, that
            `TreeRow.edgeId` publishes. The REQUEST field `assemblyCiId` is a different field
            and keeps its name.
        forked:
          oneOf: [{ type: boolean }, { type: 'null' }]
          description: |
            True when an `update` had to allocate a **new** row revision rather than edit one in
            place — because a baseline had frozen it, or because the update changed the stored
            child revision, which always forks. Surfaced because your next read will
            show a revision number you did not ask for.

            **Deliberately not defaulted.** Only `update` forks. `null` means *not applicable*
            (there was nothing to fork on a `claim` or an `exclude`); `false` means *this write could
            have forked and did not*. A client must treat them differently, so the field must be able
            to say both.

            Also `null` on an `update` that auto-claimed (`claimed: true`) — it minted a claim's
            first revision, exactly as `claim` does — and on a revision-only `update` that the row
            already satisfied, which writes nothing.
        claimed:
          oneOf: [{ type: boolean }, { type: 'null' }]
          description: |
            `true` when this operation took ownership of a `base` edge on the caller's behalf,
            which only an `update` sent with `autoClaim: true` can do. Nothing else in
            the response would say so: `edgeId` is populated either way.

            **Never `false`.** It is `null` whenever no claim was performed: `autoClaim` off, an
            `autoClaim` on an edge the branch already owned, a failure, and every other operation.

    # -------------------------------------------------- baselines

    BaselineCutRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
          description: '`Baseline__c.Name`. Over 80 characters is a 400, not a 500.'
          examples: ['Pilot build 1']
        cutDateTime:
          type: string
          format: date-time
          description: |
            Optional; defaults to the server clock. Becomes `resolutionTimePoint` in the response.
            **Never accepted in the future** (`ASOF_IN_FUTURE`) — a baseline of content that does not
            exist yet is not a baseline.

    Baseline:
      type: object
      required: [baselineId, resolutionTimePoint, takenAt, memberCount]
      properties:
        baselineId: { $ref: '#/components/schemas/SalesforceId' }
        label: { type: string }
        resolutionTimePoint:
          type: string
          format: date-time
          description: What the baseline resolves against. **Stamped once, never re-derived.** Reported to the whole second, as a later read of the same record returns it.
        takenAt:
          type: string
          format: date-time
          description: The wall-clock moment of the cut. Kept apart from `resolutionTimePoint` so a clock correction cannot change what a baseline resolves to. Reported to the whole second.
        memberCount:
          type: integer
          minimum: 0
          description: |
            How many rows the cut resolved, **excluding tombstones**. This is the count of what the
            configuration *contains*, not the count of rows the tree endpoint renders. Also the
            canary behind `BASELINE_COUNT_DRIFT`; `BASELINE_PROVENANCE_DRIFT` is fed by the
            `claiming`-row count recorded alongside it.

            The cut also records a count of rows holding a chosen revision, feeding
            `BASELINE_PIN_DRIFT`. Like the `claiming` count, it is stored and **not**
            returned here: there is no `pinnedCount`.

    BaselineTree:
      type: object
      required: [baselineId, resolutionTimePoint, snapshot, parentRowKey, rows, warnings, page]
      properties:
        baselineId: { $ref: '#/components/schemas/SalesforceId' }
        label: { type: string }
        resolutionTimePoint:
          type: string
          format: date-time
          description: What the baseline resolved against when it was cut.
        snapshot:
          type: string
          description: As on `StructureTree`. A baseline never changes, so it matters only with `compare`, where it pins the target.
        parentRowKey:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The `parentRowKey` this page was read beneath; null for a read from the root.
        compareTarget:
          oneOf: [{ $ref: '#/components/schemas/ComparisonSide' }, { type: 'null' }]
          description: What `compare` compared against. Null without `compare`.
        rows:
          type: array
          description: |
            One page of the re-resolved rows, reusing the tree shape so clients render both the
            same way — with `edgeId`, `edgeKey` and `ciId` nulled, `governingTimestamp`
            collapsed onto this baseline's own `resolutionTimePoint`, and excluded rows filtered
            out.
          items: { $ref: '#/components/schemas/TreeRow' }
        warnings:
          type: array
          description: |
            Empty, except for `REDLINE_AMBIGUOUS` under `compare`. Always present. The drift
            canaries are on the [baseline findings](#operation/getBaselineFindings).
            Mixed-revision, collision, hidden-edit and `STORED_REVISION_RETIRED` warnings are
            advice about a branch, not a baseline, and are not raised. (A comparison's baseline
            side does carry `STORED_REVISION_RETIRED`.)
          items: { $ref: '#/components/schemas/TreeWarning' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # -------------------------------------------------- whole-configuration outputs

    FlattenedStructure:
      type: object
      description: One page of a flattened view — one line per part, quantities multiplied down the tree and summed.
      required: [rootRevisionId, status, jobId, lines, page]
      properties:
        asOf:
          type: string
          format: date-time
          description: The timepoint resolved — the caller's `asOf`, the server clock, or a baseline's own timepoint.
        rootRevisionId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The root `Item_Revision__c` being built.
        sourceTimePoint:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: '**T_R** — the source timepoint `base` content resolved at.'
        status: { $ref: '#/components/schemas/OutputStatus' }
        jobId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Reserved; always null in this version. Names the background job when `status` is `accepted`.
        lines:
          type: array
          description: Always present; empty rather than absent.
          items: { $ref: '#/components/schemas/FlattenedLine' }
        page: { $ref: '#/components/schemas/PageInfo' }

    FlattenedLine:
      type: object
      description: One part at one revision and secondary unique key, with its total quantity per build of the root.
      required: [childItemId, totalQuantity, occurrences, warningCodes]
      properties:
        childItemId: { $ref: '#/components/schemas/SalesforceId' }
        childItemNumber:
          oneOf: [{ type: string }, { type: 'null' }]
          examples: ['Motor-002']
        childItemName:
          oneOf: [{ type: string }, { type: 'null' }]
          examples: ['Brushless motor, 24 V']
        childItemRevisionId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: The revision every occurrence on this line renders. Null for a floating row whose item has nothing released at the read clock.
        childRevisionLabel:
          oneOf: [{ type: string }, { type: 'null' }]
          examples: ['rev-1']
        secondaryUniqueKey:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The BOM lines' secondary unique key; null where the lines carry none. Lines of one part at one revision with different keys stay separate, as in the eBOM flattened view.
        totalQuantity:
          type: number
          description: The part's quantity multiplied down each occurrence path from the root, summed over every occurrence on this line.
          examples: [12]
        occurrences:
          type: integer
          minimum: 1
          description: How many places in the tree contribute to this line.
        warningCodes:
          type: array
          description: '`MIXED_REVISION` when the same part also appears at another revision, on another line. Always present.'
          items: { type: string }

    Findings:
      type: object
      description: One page of the warnings about a whole configuration — a branch's, or a baseline's drift.
      required: [status, jobId, findings, page]
      properties:
        asOf:
          type: string
          format: date-time
          description: The timepoint resolved — the caller's `asOf`, the server clock, or a baseline's own timepoint.
        rootRevisionId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
        status: { $ref: '#/components/schemas/OutputStatus' }
        jobId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Reserved; always null in this version.
        findings:
          type: array
          description: Always present; empty is the healthy answer.
          items: { $ref: '#/components/schemas/TreeWarning' }
        page: { $ref: '#/components/schemas/PageInfo' }

    OutputStatus:
      type: string
      enum: [completed, accepted]
      description: |
        Whether the output in this response is complete (`completed`, with HTTP 200 or 201), or was
        accepted as a background job (`accepted`, with HTTP 202 and a `jobId`). **This version
        always answers `completed`.** `accepted` is reserved so a later version can process very
        large configurations in the background without breaking a client that already checks it.

    # -------------------------------------------------- pull

    EntryKind:
      type: string
      description: |
        What kind of change the diff found. Deliberately framed in generic framework terms (source /
        member / claim) rather than MBOM terms, so the taxonomy survives a second
        configuration-item type. See the preview endpoint's table for the full catalog.
      enum:
        - source-version-advance
        - member-version-advance
        - member-added
        - member-removed
        - claim-retained
        - claim-superseded
        - claim-orphaned
        - member-add-collision
        - member-add-converged

    Decision:
      type: string
      description: |
        Whether this entry needs the caller to decide anything. **Only two values.** `required`
        means `claim-orphaned` only — a pull has exactly one required kind, and disposing an
        orphaned claim is its only mandatory decision point. An `informational` entry may still
        **offer** an optional action in `availableActions` (`accept-fields`, `release`);
        undecided, its outcome is the default — the branch's value wins.
      enum: [informational, required]

    Action:
      type: string
      description: |
        An action the commit endpoint can apply. A decision is valid only when its entry
        **offers** the action in `availableActions`; otherwise `INVALID_REQUEST`. Matched
        case-insensitively; echoed in its canonical lowercase spelling.

        - `convert-to-native` — `claim-orphaned` only. Sever the claim's provenance link, keeping
          its branch-owned content, which then resolves on the branch clock. ("Native" is the
          framework's existing term for branch-owned content with no upstream provenance.)
        - `remove` — `claim-orphaned` only. Append a deletion marker (an exclude delta). Nothing
          is hard-deleted.
        - `accept-fields` — optional, on `claim-retained` (not a `replace` substitute) and
          `member-add-collision`. Takes the fields named in `acceptedFields`; the rest
          keep the branch's values. Compiles to exactly **one** `update` on the entry's edge.
        - `release` — optional, on `claim-superseded` only, where the claim now
          matches upstream anyway. A `revert` of the claim, pinned or tracking alike: the branch
          stops owning the row, which renders upstream's line. Takes no `acceptedFields`.

        `retired` appears only in `AppliedEntry.action`, for a `member-add-converged` entry the
        commit retired automatically; it is never sent.
      enum: [convert-to-native, remove, accept-fields, release]

    PullPreview:
      type: object
      required: [status, jobId, sourceId, branchId, sourceType, currentSourceVersion, hasChanges, summary, entries, warnings, page, previewId, diffFingerprint, generatedAt]
      properties:
        status:
          allOf: [{ $ref: '#/components/schemas/OutputStatus' }]
          description: |
            `completed` — the preview is computed and every field below is filled in. Always
            `completed` in this version. `accepted` (with HTTP 202 and a `jobId`) is reserved for a
            background preview.
        jobId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Reserved; always null in this version.
        sourceId: { $ref: '#/components/schemas/SalesforceId' }
        branchId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The owning branch, denormalised for display.
        branchLabel:
          type: string
          description: The branch's label, or its name when the label is blank.
        sourceType:
          type: string
          enum: [Ebom, Pull]
          description: Always `Ebom` in this version; `Pull` (branch-to-branch) is reserved for a later version.
        currentSourceVersion: { $ref: '#/components/schemas/SourceVersionRef' }
        candidateSourceVersion:
          oneOf: [{ $ref: '#/components/schemas/SourceVersionRef' }, { type: 'null' }]
          description: Absent or null when `hasChanges` is false and no newer revision exists to preview.
        hasChanges:
          type: boolean
          description: |
            False when the branch already resolves against the candidate, or there is no newer
            released revision. `entries` is empty in that case. **Not an error condition.**
        summary: { $ref: '#/components/schemas/DiffSummary' }
        entries:
          type: array
          description: |
            One page of the differences found: every `required` entry before any informational
            one, each tier in a stable, deterministic order. Always present; empty rather than
            absent.
          items: { $ref: '#/components/schemas/DiffEntry' }
        warnings:
          type: array
          description: |
            Non-blocking conditions about what would render *after* the pull (with no optional decision taken) — typically `MIXED_REVISION`, and `PINNED_SUBTREE_HIDES_EDITS` for a branch edit a post-pull pin will hide. Always present; empty rather than absent.

            `STORED_REVISION_RETIRED` is not raised here; the branch tree read and the comparison
            raise it.
          items: { $ref: '#/components/schemas/TreeWarning' }
        page: { $ref: '#/components/schemas/PageInfo' }
        previewId:
          type: string
          description: |
            Opaque name of this preview — the candidate, the branch state it was taken against, and
            the diff. The same on every page, unless a Draft row edited in place between pages
            changes the diff; it then changes with `diffFingerprint`, and a commit carrying the
            earlier one answers `409 STALE_REVISION`. Send it on the commit. Never parse it.
          examples: ['pv1.Xk3q9fA2c41ab7e0']
        diffFingerprint:
          type: string
          description: |
            Opaque `sha256:`-prefixed digest of the inputs and the **complete** resolved entry set
            (not one page). Echo it back on commit; a mismatch means the world moved in
            between and fails fast with `STALE_REVISION`.

            It covers a **clock-free** projection of the entries, because a claiming row's
            `governingTimestamp` *is* the read clock — folding it in would make every commit stale on
            arrival. The projection includes each entry's `availableActions` and
            `revisionAdvances`. It does **not** cover the commit's `decisions[]`.
          examples: ['sha256:9f2c41ab7e08d3b6']
        generatedAt:
          type: string
          format: date-time
          description: Server clock at computation time. Informational; **not** a resolution input, and not part of the fingerprint.

    SourceVersionRef:
      type: object
      description: |
        One version of a source — the accepted eBOM root revision plus the clock that governs
        traversal beneath it.

        `rootItemRevisionId`, `rootItemNumber` and `rootRevisionLabel` name an `Item_Revision__c`,
        because every source in this version is an eBOM source. A later source type would add an
        alternative shape, discriminated on `PullPreview.sourceType` — an additive change.
      required: [rootItemRevisionId, resolutionTimestamp]
      properties:
        sourceRevisionId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: The `Branch_Source_Rev__c` recording this acceptance. **Null on `candidateSourceVersion`**, which does not exist until a commit creates it.
        rootItemRevisionId: { $ref: '#/components/schemas/SalesforceId' }
        rootItemNumber: { type: string, examples: ['Assy-100'] }
        rootRevisionLabel: { type: string, examples: ['rev-1'] }
        resolutionTimestamp:
          type: string
          format: date-time
          description: |
            **T_R** — the timestamp the eBOM traversal resolves against. Stamped once at acceptance
            from the root revision's release date and read thereafter, never re-derived. Deriving it
            per-read would let a later corrected or backdated approval silently rewrite history.
        acceptedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: Wall-clock moment the acceptance was committed, kept distinct from `resolutionTimestamp`. Null on `candidateSourceVersion`.

    DiffSummary:
      type: object
      description: Counts over the **whole** diff, on every page, so a caller can render "N informational, M requiring a decision" without paging through `entries`.
      required: [total, informational, required, byKind]
      properties:
        total: { type: integer, minimum: 0 }
        informational: { type: integer, minimum: 0 }
        required:
          type: integer
          minimum: 0
          description: Entries that will block a commit until given an explicit decision. Only `claim-orphaned` counts here.
        byKind:
          type: object
          description: Count per `EntryKind`, keyed by kind. Kinds with no entries are omitted.
          additionalProperties: { type: integer, minimum: 0 }

    DiffEntry:
      type: object
      required: [entryId, kind, decision, availableActions, target]
      properties:
        entryId:
          type: string
          description: |
            Stable, opaque handle, passed back to the commit endpoint to attach a decision. A
            **deterministic hash of `kind` plus the correlation key** — never a database Id, never
            positional, never generated — so recomputing the same diff yields the same ids. Treat it
            as opaque; do not parse it.
          examples: ['e3f19a4c8b2d6071']
        kind: { $ref: '#/components/schemas/EntryKind' }
        decision: { $ref: '#/components/schemas/Decision' }
        availableActions:
          type: array
          description: |
            The decisions the commit accepts for this entry. Always present.

            | kind | availableActions |
            |---|---|
            | `claim-orphaned` | `["convert-to-native", "remove"]` — required |
            | `claim-retained` (not a `replace` substitute) | `["accept-fields"]` — optional |
            | `claim-retained` with `claimKind: replace` | `[]` |
            | `member-add-collision` | `["accept-fields"]` — optional |
            | `claim-superseded` | `["release"]` — optional |
            | every other kind | `[]` |

            An optional action never changes `decision` (it stays `informational`) or
            `summary.required`. `accept-fields` is offered without checking that some field could
            legally be taken.
          items: { $ref: '#/components/schemas/Action' }
        retargeted:
          oneOf: [{ type: boolean }, { type: 'null' }]
          description: |
            **Present only on `claim-retained`; `null` on every other kind** (deliberately not
            defaulted — a `false` would assert something about a kind for which the question is
            meaningless).

            True when the suppressed upstream change was a **re-target**: the candidate would resolve
            this edge to a different child *revision* than the claim renders — the shape a
            **pinned** claim takes when upstream re-revs its line. False when only field
            values (quantity, find number) were suppressed. Lets a caller filter for the
            higher-stakes case — a branch silently keeping a superseded revision after upstream moved
            on — without parsing `message`.

            The child *revision*, not the child *item*: see the endpoint description. Always
            `false` for a `replace` substitute, and never `true` on a tracking claim.
            Only a retargeted pinned claim's revision **diverges** for `accept-fields`.
        revisionAdvances:
          oneOf: [{ type: boolean }, { type: 'null' }]
          description: |
            Present on `claim-retained` and `claim-superseded`, and `null` (key
            present) on every other kind, including `claim-orphaned` — deliberately not defaulted,
            like `retargeted`. Informational only: it changes no `kind`, `decision`,
            `availableActions` or commit requirement.

            `true` when this is a **tracking** claim, one that stores no revision, and the revision
            it renders moves with this pull: after the commit it renders the candidate's line
            revision. The entry's kind is still judged on quantity and find number alone. The
            move is otherwise visible only by comparing `current.detail.childItemRevisionId` with
            `candidate.detail.childItemRevisionId`.

            **Never true together with `retargeted`.** `retargeted` is about a *pinned* claim that
            upstream moved away from. A pin does not move, so its `revisionAdvances` is `false`.
            A tracking claim is never retargeted. A `replace` substitute is `false`. The value is
            covered by `diffFingerprint`. A `base` row's advance is reported as
            `member-version-advance`.
        claimKind:
          oneOf: [{ type: string, enum: [claim, replace] }, { type: 'null' }]
          description: |
            Present on `claim-*` kinds; null elsewhere. Distinguishes a claim created by
            **claiming** an upstream edge from one created by **replacing** it. Both dispose
            identically; this exists so the UI can explain what is being orphaned.
        message:
          type: string
          description: Human-readable, already-localized summary. Never parse it — switch on `kind`.
        target: { $ref: '#/components/schemas/MemberTarget' }
        current:
          oneOf: [{ $ref: '#/components/schemas/MemberState' }, { type: 'null' }]
          description: How the branch renders this member today. **Null for `member-added`.**
        candidate:
          oneOf: [{ $ref: '#/components/schemas/MemberState' }, { type: 'null' }]
          description: How it would render after the pull. **Null for `member-removed`**, and for a `claim-orphaned` resolved by `remove`.

    MemberTarget:
      type: object
      description: Identifies what the entry is about, independent of before/after state.
      required: [ciKind, label]
      properties:
        ciKind: { $ref: '#/components/schemas/CiKind' }
        edgeId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: The `Assembly_CI__c` for this member. Null for `base` content, which has no branch-owned record until something claims it.
        edgeKey:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            The **display** key — the eBOM `Assembly__c` line id, or the synthetic key of
            branch-local content (see `TreeRow.edgeKey`).
            **Not** what a pull correlates on: it moves when a parent item revs, which is exactly why
            the diff cannot join on it.
        label:
          type: string
          description: |
            Short display label for the member — the **child item's** item number
            (`Item__c.Name`). On a `source` target it is the root item's number instead, because
            that entry is about the root item and has no child.
          examples: ['Motor-002']
        rowKey:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            The `rowKey` of the row this entry is about: in the branch's **current**
            tree on a pull preview, in the **left** side's tree on a comparison. A client uses it
            to show the entry in the tree. Null when that tree has no such row (`member-added`) and
            on a root entry. When the member renders at more than one occurrence, the first in tree
            order.
          examples: ['a0Bg8000000Ab10']
        path:
          type: array
          description: Breadcrumb from the root to this member's parent, for UI context.
          items: { $ref: '#/components/schemas/PathSegment' }

    PathSegment:
      type: object
      description: One ancestor in a breadcrumb. Same shape as `MemberTarget` minus the path — a segment never nests its own breadcrumb.
      required: [ciKind, label]
      properties:
        ciKind: { $ref: '#/components/schemas/CiKind' }
        label: { type: string, examples: ['Assy-100'] }
        edgeId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
        edgeKey:
          oneOf: [{ type: string }, { type: 'null' }]

    MemberState:
      type: object
      description: A member as resolved at one point in the diff (before or after). The generic fields are framework-level; everything type-specific lives in `detail`.
      required: [provenance, governingClock, detail]
      properties:
        provenance: { $ref: '#/components/schemas/Provenance' }
        governingClock: { $ref: '#/components/schemas/GoverningClock' }
        governingTimestamp:
          type: string
          format: date-time
          description: The concrete timestamp `governingClock` resolved to.
        detail:
          oneOf: [{ $ref: '#/components/schemas/AssemblyEdgeDetail' }]
          discriminator:
            propertyName: ciKind
            mapping:
              assembly-edge: '#/components/schemas/AssemblyEdgeDetail'

    AssemblyEdgeDetail:
      type: object
      description: |
        **The one MBOM-specific schema.** Everything above this point is reusable framework
        vocabulary; this is the single place assembly/BOM concepts appear. A second
        configuration-item type becomes a sibling schema in `MemberState.detail`'s `oneOf` and
        changes nothing else.

        ## Display fields

        `parentItemNumber`, `childItemNumber`, `childItemName` and `childRevisionLabel` are
        populated on every read. They are looked
        up once per page, never once per row. They are display values: null where the record is
        not visible to the caller, so never treat a null as evidence that an item has no number.
      required: [ciKind]
      properties:
        ciKind: { type: string, const: assembly-edge }
        parentItemId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: |
            The owning **item**, not its revision: an edge's parent item is stable across revision
            advances, while its parent revision is not.

            **Null on a root entry** — see `quantity` for why.
        parentItemNumber:
          oneOf: [{ type: string }, { type: 'null' }]
          description: 'The parent item''s number (`Item__c.Name`). See the schema description.'
          examples: ['Assy-100']
        childItemId: { $ref: '#/components/schemas/SalesforceId' }
        childItemNumber:
          oneOf: [{ type: string }, { type: 'null' }]
          description: 'The child item''s number (`Item__c.Name`). See the schema description.'
          examples: ['Motor-002']
        childItemName:
          oneOf: [{ type: string }, { type: 'null' }]
          description: 'The child item''s description, for display. See the schema description.'
          examples: ['Brushless motor, 24 V']
        childItemRevisionId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: |
            The child revision this row renders. Which clock chose it depends on the row, and the
            enclosing `governingTimestamp` does not always name that clock:

            - a `base` row resolves at the source's T_R, and `governingTimestamp` is T_R;
            - a **tracking** claim (no stored revision) also resolves at T_R — it renders the source
              line's revision — but its `governingTimestamp` is `asOf`, because that one field also
              governs the claim's quantity and find number;
            - a **pinned** row (a stored `childItemRevisionId`) renders the pin whatever
              either clock says; its `governingTimestamp` is `asOf`, which chose nothing;
            - a floating `new` row or substitute, and every `nested` row, resolve at `asOf`.

            A tombstone over a source line keeps the revision of the line it removed; a tombstone of
            a branch-local row carries none. Also null on a floating row whose item has nothing
            released at `asOf` — the row still renders.

            This is the value to send back as `childItemRevisionId` to pin, or keep, what the tree
            shows.
        childRevisionLabel:
          oneOf: [{ type: string }, { type: 'null' }]
          description: 'The label of `childItemRevisionId`. See the schema description.'
          examples: ['rev-1']
        quantity:
          oneOf: [{ type: number }, { type: 'null' }]
          description: |
            **Null on a root entry.** The `source-version-advance` / `root-version-differs` entry at
            the top of a pull diff or comparison is about the root *item*, which has no parent, no
            quantity and no find number — its `target.ciKind` is `source`, not `assembly-edge`. Every
            edge entry populates all three.
          examples: [4]
        findNumber:
          oneOf: [{ type: number }, { type: 'null' }]
          description: A Salesforce `Number` field, never a string. **Null on a root entry** — see `quantity`.
          examples: [10]

    PullCommitRequest:
      type: object
      required: [candidateRootRevisionId, diffFingerprint]
      properties:
        candidateRootRevisionId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The released root revision being accepted. Same validation as the preview's query param — and re-validated here, from the re-resolved diff.
        diffFingerprint:
          type: string
          description: Echoed back from the preview this commit is acting on. A mismatch against the freshly re-resolved diff fails the whole commit with `STALE_REVISION`.
          examples: ['sha256:9f2c41ab7e08d3b6']
        previewId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            The `previewId` of the preview this commit is acting on. Optional in this
            version, and checked like `diffFingerprint` when sent: a preview that no longer
            describes the diff fails the commit with `STALE_REVISION`. Send it now; a later version
            that keeps large diffs server-side will look them up by it.
          examples: ['pv1.Xk3q9fA2c41ab7e0']
        decisions:
          type: array
          description: |
            One entry per `claim-orphaned` entry from the preview. **Every one must appear**, or
            the commit is rejected with `DISPOSITION_REQUIRED`. Send `[]` (or omit) when the preview
            had no required entries.

            It may also carry **optional** decisions: `accept-fields` (with
            `acceptedFields`) on `claim-retained` / `member-add-collision`, and `release` on
            `claim-superseded`. An entry left undecided keeps the branch's value.
            `DISPOSITION_REQUIRED` keys on `claim-orphaned` alone. A decision whose `action` its
            entry does not offer in `availableActions` is `400 INVALID_REQUEST`.

            There is **no fixed limit**: send every decision in one commit. A commit too
            large for one transaction is refused whole with `413 STRUCTURE_TOO_LARGE`.
          items:
            type: object
            required: [entryId, action]
            properties:
              entryId:
                type: string
                description: An `entryId` from the preview this commit is acting on.
              action: { $ref: '#/components/schemas/Action' }
              childItemRevisionId:
                oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
                description: |
                  `convert-to-native` only: the child revision to **stamp** onto the
                  converted row. Same meaning and validation as `DeltaOperation.childItemRevisionId`
                  on a `convert-to-native` operation, which this is copied onto. "Keep what it
                  shows" is the orphaned entry's own `current.detail.childItemRevisionId`, sent
                  back. **Refused** beside any other action — `400 INVALID_REQUEST`
                  (`childItemRevisionId and trackChildRevision are only taken with
                  convert-to-native, not with <action>`).
              trackChildRevision:
                oneOf: [{ type: boolean }, { type: 'null' }]
                description: |
                  `convert-to-native` only: `true` stores no revision, so the converted
                  row floats at the read clock like an `add`. A `convert-to-native` decision carries
                  **exactly one** of this and `childItemRevisionId`, or the commit answers
                  `422 REVISION_CHOICE_REQUIRED` before any delta or acceptance is written.

                  `true` beside any other action is refused `400 INVALID_REQUEST`;
                  `false` or absent chooses nothing and is accepted beside
                  every action, so a client that serialises boolean defaults keeps working.
              acceptedFields:
                type: object
                minProperties: 1
                additionalProperties: false
                description: |
                  `accept-fields` only, and required there; refused beside any other
                  action. Each key is a field of the entry and each value says what to do with it.
                  **Name only what you are taking.** An omitted field keeps the branch's own value.
                  Keys and values are matched **case-insensitively** and echoed in the canonical
                  form shown here; a key named twice in different case is refused.

                  | Value | Meaning | Stores |
                  |---|---|---|
                  | `candidate` | Hold what upstream resolves now | the candidate's value. For the revision this is a **pin**, which reports `retargeted: true` again when upstream next moves the line. |
                  | `release` | Stop holding the branch's own value | nothing. For the revision this is the state `trackChildRevision: true` leaves. A claim becomes a tracking claim that follows T_R and still gets a `claim-*` entry on every pull. A native row (`member-add-collision`) floats at the read clock. |

                  `candidate` and `release` render identically on this pull and differently on
                  later ones.

                  Refused with `400 INVALID_REQUEST` (full texts on the commit's 400 response):

                  - any key other than the three below, including `childItem` and
                    `childItemRevision`
                  - a null or empty object
                  - a value other than `candidate` / `release`
                  - a field that does not **actually diverge**, meaning the value the branch holds
                    does not differ from the candidate's. A tracking claim holds no revision, so
                    its revision never diverges, even when `current` and `candidate` render
                    different revisions.
                  - `candidate` on a field the candidate line leaves blank, or a candidate quantity
                    of 0 or less
                  - `release` on a revision the branch does not hold (a floating collision)
                  - `release` on `quantity` or `findNumber`, which have no source value to fall
                    back to on their own. Use `revert`, or `release` on `claim-superseded`.
                  - `acceptedFields` on any action other than `accept-fields`
                properties:
                  quantity: { type: string, enum: [candidate] }
                  findNumber: { type: string, enum: [candidate] }
                  childItemRevisionId: { type: string, enum: [candidate, release] }
                examples:
                  - { childItemRevisionId: candidate }

    PullCommitResult:
      type: object
      required: [status, jobId, sourceId, newSourceRevisionId, acceptedRootRevisionId, acceptedAt, applied]
      properties:
        status:
          allOf: [{ $ref: '#/components/schemas/OutputStatus' }]
          description: |
            `completed` — the pull is committed and every field below is filled in. Always
            `completed` in this version. `accepted` (with HTTP 202 and a `jobId`) is reserved for a
            background commit.
        jobId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Reserved; always null in this version.
        sourceId: { $ref: '#/components/schemas/SalesforceId' }
        newSourceRevisionId:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The `Branch_Source_Rev__c` this commit created — an **insert**, never an update.
        acceptedRootRevisionId: { $ref: '#/components/schemas/SalesforceId' }
        acceptedAt:
          type: string
          format: date-time
          description: When the acceptance was committed, reported to the whole second, as a later read of the same record returns it.
        applied:
          type: array
          description: |
            Every entry that took an explicit decision (including a decided
            `member-add-collision`), plus every `claim-retained`,
            `claim-superseded` and `member-add-converged` outcome — the set a caller needs to
            reconcile its held preview against what actually happened. (Re-previewing immediately
            after a commit is always `hasChanges: false`, so this is the only place to learn it.)

            `member-add-converged` reports `action: "retired"`; see the endpoint description.
          items: { $ref: '#/components/schemas/AppliedEntry' }

    AppliedEntry:
      type: object
      description: |
        One outcome the commit is reporting back. Five kinds appear here and no others:
        `claim-orphaned` (the decision you supplied), `claim-retained` and `claim-superseded`
        (always, decided or not), `member-add-converged` (retired by the commit), and
        `member-add-collision` — **only when a decision was taken on it**.

        A re-preview straight after a commit is always `hasChanges: false`, so this array is the
        only place the retained and superseded outcomes can be read.
      required: [entryId, kind]
      properties:
        entryId: { type: string }
        kind:
          type: string
          enum: [claim-orphaned, claim-retained, claim-superseded, member-add-converged, member-add-collision]
          description: '`member-add-collision` appears only when an `accept-fields` decision was taken on it; an undecided collision is not echoed.'
        action:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            What was done, in the decision's **canonical** lowercase spelling (`remove`, not
            `Remove`, whatever the request's casing):

            - `convert-to-native` or `remove` — the decision supplied for a `claim-orphaned`
              entry.
            - `accept-fields` — on a `claim-retained` or `member-add-collision` entry that took
              that optional decision; see `acceptedFields`.
            - `release` — on a `claim-superseded` entry that took that optional decision; the
              claim was reverted.
            - `retired` — on `member-add-converged`. The commit appended a revert, dropping
              the branch's now-redundant local assertion. No decision is accepted for this kind.
            - `null` — on an undecided `claim-retained` or `claim-superseded`, where nothing was
              written.
        acceptedFields:
          oneOf:
            - type: object
              additionalProperties: { type: string, enum: [candidate, release] }
            - type: 'null'
          description: |
            The `accept-fields` decision's map in canonical form — field names
            `quantity` / `findNumber` / `childItemRevisionId`, values `candidate` / `release`,
            whatever the request's casing. `null` for every other action and for undecided entries.
          examples:
            - { quantity: candidate, childItemRevisionId: candidate }
        edgeId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: The branch-owned `Assembly_CI__c` this entry's target names, if any. For a live `replace` substitute's `claim-retained`, the substitute's edge.

    # -------------------------------------------------- comparison

    CompareSideKind:
      type: string
      description: |
        Which resolution produced a side of a comparison. The right-hand side may be any of the
        four; the **left** may only be `branch` or `baseline`, because those are the two objects a
        comparison path is rooted at.

        Sent as `rightKind` — where it is matched case-insensitively — and returned as
        `left.kind` / `right.kind`, always in this lower-case spelling.
      enum: [branch, baseline, source, ebom]

    CompareKind:
      type: string
      description: |
        What a comparison entry reports. The counterpart to `EntryKind`, which is the **pull's**
        vocabulary, and deliberately a separate set: a pull is asymmetric and its kinds name what a
        pull would *do*, while a comparison is symmetric and does nothing. `member-added` and
        `member-removed` are the two wire values the two vocabularies share, and they mean the same
        thing in both.

        See the endpoint description for what each one means and when it is emitted.
      enum:
        - root-version-differs
        - member-added
        - member-removed
        - member-differs
        - member-unchanged

    Comparison:
      type: object
      description: |
        The whole answer to "how do these two configurations differ": what each side was, one entry
        per differing correlation key, counts over the complete set, and each side's own warnings.

        No envelope, nulls not suppressed, and every collection always `[]` rather than absent —
        the same conventions as the rest of this API.
      required: [left, right, identical, summary, entries, leftWarnings, rightWarnings, page, generatedAt]
      properties:
        left:
          allOf: [{ $ref: '#/components/schemas/ComparisonSide' }]
          description: The side the path named — a branch or a baseline.
        right:
          allOf: [{ $ref: '#/components/schemas/ComparisonSide' }]
          description: The side `rightKind` / `rightId` named.
        identical:
          type: boolean
          description: |
            True when the two configurations contain the same members with the same content.

            Computed over the **whole** comparison, and the same on every page: true exactly when
            the comparison has no entry of any kind other than `member-unchanged`. So it reads the
            same whether or not the unchanged rows were asked for, and a `root-version-differs`
            entry is enough on its own to make it false.
        summary: { $ref: '#/components/schemas/CompareSummary' }
        entries:
          type: array
          description: |
            One page of entries: one per differing correlation key — plus every matching one when
            `includeUnchanged=true` — ordered by breadcrumb path, then find number, then child item
            id, then kind. Always present; empty rather than absent, and empty is the ordinary
            shape of an identical comparison.
          items: { $ref: '#/components/schemas/CompareEntry' }
        leftWarnings:
          type: array
          description: |
            Warnings about the **left** side's own resolution — typically `MIXED_REVISION` — plus
            `COMPARE_ROOTS_DIFFER`, which is about the pair and is reported here, first, because it
            reframes everything below it.

            A branch or baseline side carries its resolution's complete warning set, including
            `STORED_REVISION_RETIRED`; a baseline side adds its drift canaries,
            including `BASELINE_PIN_DRIFT`. A source or `ebom` side stores no revisions
            and carries neither.
          items: { $ref: '#/components/schemas/TreeWarning' }
        rightWarnings:
          type: array
          description: Warnings about the **right** side's own resolution, populated as `leftWarnings` is (without `COMPARE_ROOTS_DIFFER`). Always present; empty rather than absent.
          items: { $ref: '#/components/schemas/TreeWarning' }
        page: { $ref: '#/components/schemas/PageInfo' }
        generatedAt:
          type: string
          format: date-time
          description: |
            Server clock at computation time, read **once** for the whole call so the two sides are
            never resolved microseconds apart. Not a resolution input — each side publishes its own
            clocks.

    ComparisonSide:
      type: object
      description: |
        One of the two configurations that were compared: what it was, how it resolved, and on
        which clock.

        Published for **both** sides rather than echoed only for the one the path named, because a
        comparison's answer is unreadable without knowing what was compared — `member-added` means
        nothing until the reader knows the right side is a baseline from March rather than the
        branch's own source.
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/CompareSideKind' }
        id:
          allOf: [{ $ref: '#/components/schemas/SalesforceId' }]
          description: The record this side was addressed by — a `Branch__c`, `Baseline__c`, `Branch_Source__c` or `Item_Revision__c`.
        label:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            The side's own display name where the addressed record has one — `Branch__c.Label__c`
            for a branch, `Baseline__c.Name` for a baseline — and the **root item number** otherwise,
            so a UI always has something to render beside the column. A `source` and an `ebom` side
            are named by what they supply rather than by a record a user would recognise.
          examples: ['MBOM-GDL']
        rootItemId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
        rootItemNumber:
          oneOf: [{ type: string }, { type: 'null' }]
          examples: ['Assy-100']
        rootRevisionId:
          oneOf: [{ $ref: '#/components/schemas/SalesforceId' }, { type: 'null' }]
          description: The root `Item_Revision__c` this side resolved to. **Null** when a source has nothing accepted yet.
        rootRevisionLabel:
          oneOf: [{ type: string }, { type: 'null' }]
          examples: ['rev-1']
        asOf:
          type: string
          format: date-time
          description: |
            The read clock this side was resolved at — the caller's `asOf` / `rightAsOf`, the
            server clock when none was supplied, an eBOM revision's release date, or a baseline's
            own `resolutionTimePoint`. A baseline echoes the timepoint its **cut** recorded,
            which makes it obvious the caller could not have chosen it.
        sourceTimePoint:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            **T_R** — the timepoint this side's `base` content resolves at. Separate from
            `asOf` because that is the whole model: a side reporting one number could not explain
            its own rows.

            An `ebom` side publishes the same value in both, honestly rather than leaving this null:
            a raw walk has no acceptance pinning it and no branch content floating above it, so its
            traversal clock **is** its T_R. Null only where a source has accepted nothing.

    CompareEntry:
      type: object
      description: |
        One difference between the two configurations, keyed by correlation key.

        **Not the pull's `DiffEntry`.** That contract names its two states `current` and
        `candidate`, which is a lie on a symmetric pair — a baseline compared against a raw eBOM has
        no "current" side — and it carries four fields a comparison has no use for. The **leaf**
        types are shared deliberately: `MemberTarget`, `MemberState`, `PathSegment` and
        `AssemblyEdgeDetail` describe where a member sits and how one side renders it, which is
        identical work in both features. Only the envelope differs.
      required: [entryId, kind, differingFields, message, target]
      properties:
        entryId:
          type: string
          description: |
            Stable, opaque handle: a deterministic hash of the kind plus the correlation key,
            truncated to 16 hex characters. Never a database id, never positional, never generated —
            so a repeated comparison returns the same handles. There is nothing to pass it back to;
            it exists so a client can key a row. Do not parse it.

            **One entry per correlation key, always** — two entries on one key would collide, which
            is why `member-differs` carries `differingFields` rather than splitting into one kind
            per field.
          examples: ['7b31c0d5e9a24f18']
        kind: { $ref: '#/components/schemas/CompareKind' }
        differingFields:
          type: array
          description: |
            Which of the three assertable values disagree, in a fixed order so two calls produce
            byte-identical lists. Populated on `member-differs`; **empty on every other kind** —
            empty rather than null, so a client can iterate unconditionally.

            Provenance is deliberately not among them: each side's state already publishes it, and
            a provenance-only difference is not a content difference.
          items:
            type: string
            enum: [quantity, findNumber, childRevision]
        message:
          type: string
          description: Human-readable, from a Custom Label, with the member's own item number appended. Translated; switch on `kind`, never on text.
        target: { $ref: '#/components/schemas/MemberTarget' }
        left:
          oneOf: [{ $ref: '#/components/schemas/MemberState' }, { type: 'null' }]
          description: How the **left** side renders this member. **Null on `member-added`.**
        right:
          oneOf: [{ $ref: '#/components/schemas/MemberState' }, { type: 'null' }]
          description: How the **right** side renders this member. **Null on `member-removed`.**

    CompareSummary:
      type: object
      description: |
        Counts over the **whole** comparison, on every page — never over one page of entries.

        Read the two groups differently. `total` and `byKind` count entries **emitted**, so both
        move with `includeUnchanged`. `added`, `removed`, `differing` and `unchanged` count
        correlation keys and do not.
      required: [total, added, removed, differing, unchanged, byKind]
      properties:
        total:
          type: integer
          minimum: 0
          description: Entries produced — `root-version-differs` and any `member-unchanged` included. Moves with `includeUnchanged`.
        added:
          type: integer
          minimum: 0
          description: Correlation keys present on the **right** side only.
        removed:
          type: integer
          minimum: 0
          description: Correlation keys present on the **left** side only.
        differing:
          type: integer
          minimum: 0
          description: Correlation keys present on both sides whose content disagrees.
        unchanged:
          type: integer
          minimum: 0
          description: |
            Correlation keys present on both sides and identical.

            **Populated whether or not `includeUnchanged` was set**, which is the point of it: the
            default comparison emits no row for an identical member, and a caller still needs to
            know how much of the configuration matched without paying for the rows. It therefore
            does **not** always equal `byKind['member-unchanged']`, which counts emitted entries and
            is `0` by default.
        byKind:
          type: object
          description: |
            Count per `CompareKind`, keyed by its wire value, over emitted entries.

            **Pre-seeded with all five kinds at zero**, unlike the pull's `DiffSummary`, which
            carries only the kinds it observed: a comparison is read by a client rendering a fixed
            set of counters, and an absent key would make each one a null check.
          additionalProperties: { type: integer, minimum: 0 }

    # -------------------------------------------------- errors

    RestError:
      type: object
      description: |
        The MBOM's error shape. Keyed **`code`**, not the framework's `errorCode`.

        A 403 body carries the label **only**: naming the object a caller was just denied would hand
        them the schema they have no access to. It goes to the debug log instead. A 500 carries
        the error type only — enough to tell which class of fault occurred — and never its message
        or the stack trace; the full detail goes to the debug log.
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            The stable error code. Every value below is a client error; a 500 carries
            `INTERNAL_ERROR`, which is listed here for completeness but is not a code to branch on.
          enum:
            [CLAIM_REQUIRED, ALREADY_CLAIMED, ALREADY_EXCLUDED, NOT_EXCLUDED, NOT_SUPPLIED, NO_CLAIM,
             HARD_DELETE_BLOCKED, IMMUTABLE_FIELD, NOT_RELEASED, STALE_REVISION, CONCURRENT_WRITE,
             ALREADY_PRESENT,
             CANDIDATE_NOT_NEWER, DISPOSITION_REQUIRED, CYCLE_DETECTED, EBOM_CYCLE,
             PARENT_NOT_IN_BRANCH, UNSUPPORTED_CI_TYPE, CI_IDENTITY_UNRESOLVED,
             CI_IDENTITY_COLLISION, PROVENANCE_INVALID, CANDIDATE_ROOT_MISMATCH,
             AMBIGUOUS_CORRELATION, REVISION_ITEM_MISMATCH, REVISION_CHOICE_REQUIRED,
             BATCH_TOO_LARGE, STRUCTURE_TOO_LARGE, ASOF_IN_FUTURE, ASOF_INVALID, NOT_EDITABLE,
             INVALID_REQUEST, NOT_FOUND, FORBIDDEN, INTERNAL_ERROR]
          examples: ['NOT_RELEASED']
        message:
          type: string
          description: |
            The Custom Label for `code`, with a parenthesised **detail** appended naming the specific
            row or value. The label says what went wrong and what to do about it; the detail says
            which row it happened to. Translated — never parse it.
        failures:
          type: array
          description: |
            Present **only** on an atomic delta batch that failed validation. Carries the complete
            per-operation failure list, so a caller does not have to find their faults one round trip
            at a time.
          items: { $ref: '#/components/schemas/DeltaResult' }

  # ---------------------------------------------------------------- shared responses

  responses:

    Forbidden:
      description: |
        `FORBIDDEN` (403). The caller lacks an object grant this endpoint requires. The body names no
        object — see `RestError`.

        A field-level denial is also answered 403: every read on this path uses a fixed set of
        fields, so when a query fails, missing field access is far and away the likeliest cause.
        The one exception is a query too long for the platform to accept, which only a very large structure produces:
        that is `413 STRUCTURE_TOO_LARGE`, not 403.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            denied:
              value:
                code: FORBIDDEN
                message: 'You do not have permission to perform this action.'

    NotFoundPath:
      description: |
        `NOT_FOUND` (404). The path id is absent, unparseable, or names a **different object** than
        this endpoint expects — the last of which is why swapping a `branchId` for a `sourceId` is a
        clean 404 rather than a 500.

        Also answered for any unrecognised trailing segment: `GET .../branches/{id}/bogus` is the
        MBOM's own 404 in the MBOM's own shape (`code`), not the framework's (`errorCode`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            wrongObject:
              value:
                code: NOT_FOUND
                message: 'That record does not exist, or you do not have access to it. (a1Cg8000000AbCeEAK is not a Branch__c)'

    StructureTooLarge:
      description: |
        `STRUCTURE_TOO_LARGE` (413). The structure this request has to resolve is too
        large to process in one transaction. **Nothing is written.** Sending the same request again
        will fail the same way, so do not retry it.

        The server checks the platform limits it has actually consumed (CPU time, memory, rows read,
        queries, rows written) as it resolves, and stops with this answer before it would run out,
        rather than failing with an unhandled error or returning a partial structure. It never
        returns part of a structure as if it were the whole.

        A smaller page does not help: the limit is about the configuration, not the response.
        Depth counts as well as size: pull preview and commit support structures up to 15 levels
        deep, and a deeper structure may answer `413 STRUCTURE_TOO_LARGE`. Contact your
        administrator. A configuration this large is a candidate for splitting into smaller MBOMs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            tooLarge:
              $ref: '#/components/examples/StructureTooLarge'

    PullConflictPreview:
      description: |
        409 — well formed, retryable after state changes.

        | code | Cause |
        |---|---|
        | `NOT_RELEASED` | the candidate is not Released, or is Cancelled, Expired, or missing a release date |
        | `CANDIDATE_NOT_NEWER` | the candidate resolves at or before the source's current T_R |
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            notNewer:
              value:
                code: CANDIDATE_NOT_NEWER
                message: 'That revision is not newer than what this branch already resolves against. Choose a later release, or none is available yet. (a0Ag8000000Ab01EAC)'

    PullConflictCommit:
      description: |
        409 — well formed, retryable after state changes.

        | code | Cause | Remedy |
        |---|---|---|
        | `STALE_REVISION` | `diffFingerprint` or `previewId` mismatch, or an `entryId` that no longer names an entry in the freshly re-resolved diff | re-run `pull-preview` and resubmit |
        | `DISPOSITION_REQUIRED` | a `claim-orphaned` entry has no decision — the only kind that can raise it. (A live `replace` substitute whose superseded line upstream keeps is `claim-retained` and never raises it.) | supply one for every required entry |
        | `NOT_RELEASED` / `CANDIDATE_NOT_NEWER` | revalidated at commit time and no longer qualifies | pick another candidate |
        | `CONCURRENT_WRITE` | another transaction holds the branch's write lock — a delta batch, a baseline cut or another commit | send the same request again |
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            stale:
              value:
                code: STALE_REVISION
                message: 'What you are working from has changed since you loaded it. Reload it and try again. (the diff has changed since this fingerprint was generated; re-preview and retry)'
            dispositionRequired:
              value:
                code: DISPOSITION_REQUIRED
                message: 'This pull orphans a claim you made. Choose to keep it as branch-owned content or remove it before committing. (f4880c6b3e1a9d75, Harness-011)'

    PullUnprocessable:
      description: |
        422 — well formed, but impossible against the model. Retrying the identical request against
        the same state will never succeed.

        | code | Cause |
        |---|---|
        | `CANDIDATE_ROOT_MISMATCH` | the candidate belongs to a **different root item** than the source |
        | `CYCLE_DETECTED` / `EBOM_CYCLE` | a cycle in the eBOM below the candidate root |
        | `AMBIGUOUS_CORRELATION` | the correlation join cannot tell which upstream line corresponds to which branch line — one of the three shapes below |
        | `REVISION_CHOICE_REQUIRED` | *commit only* — a `convert-to-native` decision carried neither or both of `childItemRevisionId` and `trackChildRevision: true` |
        | `REVISION_ITEM_MISMATCH` | *commit only* — a `convert-to-native` decision's `childItemRevisionId` is not a revision of the row's child item |

        `AMBIGUOUS_CORRELATION` is raised in three shapes. Which remedy applies depends on the
        shape, and the message's detail names the edges involved:

        1. **A genuine duplicate line.** Two edges on the **same side** share a correlation key
           **and** a parent revision. This is data: the BOM has to change, by giving one of the
           lines its own secondary unique key — unless the pair is two of the branch's own rows
           at one key, which a branch edit clears.
        2. **A pairing that would be a guess.** Edges at one key are left on **both** sides under
           different parent revisions, with more than one on a side. Usually data; a branch row in
           the mix can be removed to clear it.
        3. **Two unpaired entries at one position.** Two or more edges at one key would be left
           without a counterpart on **one** side as the **same kind** of entry, so under one
           `entryId`, where the diff could report only one of them. Rows that produce no entry
           (`nested` rows, tombstones, branch-native rows) do not count, and neither do two rows
           of different kinds. A `replace` substitute beside a **claimed** line of its new child
           that upstream drops completes while upstream keeps the substitute's superseded line —
           the substitute is `claim-retained` and the claimed line the one `claim-orphaned`.
           Only when upstream drops **both** lines are both
           `claim-orphaned`, and the pull refuses. A branch edit clears it: exclude the
           substitute, or revert the claim on the dropped line, which then reads as
           `member-removed`.

        One parent item rendering at two revisions is **not** one of these: the parent revision
        separates those lines.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            revisionChoiceRequired:
              value:
                code: REVISION_CHOICE_REQUIRED
                message: "Choose how this line's part revision behaves: pick a specific revision to hold, or leave it to follow the timepoint in effect. (entryId f4880c6b3e1a9d75: a convert-to-native decision requires exactly one of childItemRevisionId and trackChildRevision: true)"
            rootMismatch:
              value:
                code: CANDIDATE_ROOT_MISMATCH
                message: "That revision belongs to a different item than this branch's source. Choose a revision of the same root item. (a0Ag8000000Ab77EAC)"
            cycle:
              value:
                code: CYCLE_DETECTED
                message: 'This change would make the child an ancestor of its own parent, which no BOM can represent. (beneath Assy-100 rev-2 at edge Harness-011)'

    ComparisonConflict:
      description: |
        409 — well formed, and retryable once state changes.

        | code | Cause |
        |---|---|
        | `NOT_RELEASED` | `rightKind=ebom` names a revision that is not Released, or is Cancelled, Expired, or carries no release date |

        The same four-part test an MBOM's creation and a pull both apply, and a 409 for the same
        reason: releasing the revision makes the identical request succeed. A Draft revision never
        appears at any timepoint and has no release date to pin a walk to, so there is nothing to
        compare against.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            notReleased:
              value:
                code: NOT_RELEASED
                message: 'An mBOM can only be created from a released item revision. (a0Ag8000000Ab99EAC)'

    ComparisonUnprocessable:
      description: |
        422 — well formed, but impossible against the model. Retrying the identical request against
        the same state will never succeed.

        | code | Cause |
        |---|---|
        | `AMBIGUOUS_CORRELATION` | the correlation join cannot tell which member on one side corresponds to which on the other. The same three shapes as on the pull (see `PullUnprocessable`): two edges on one side sharing a key **and** a parent revision, edges at one key left on both sides under different parent revisions with more than one on a side, or two or more edges at one key left unpaired on one side. A comparison reports every one-sided member on a side as one kind, so for the third shape any two members count — a substitute beside a line of the same child that the other side lacks refuses whether that line is claimed or not — and excluding the substitute clears it, since tombstones are not members. A fourth shape is the comparison's alone: two entries it would publish carry one `entryId` — two pairs at one key reported as the same kind, both `member-differs` or (with `includeUnchanged=true`) both `member-unchanged`. That happens when both configurations hold a substitute beside a line of the same child, or a claimed line beside a local `add` of the same child, and either both rows changed (two `member-differs`) or neither did and `includeUnchanged=true` (two `member-unchanged`). With one row changed, or with neither changed and `includeUnchanged` off, the comparison completes. Removing or reverting one of the branch's changes at that position clears it. Known gap: when the two sides' root items differ (`COMPARE_ROOTS_DIFFER`) the comparison runs no join and this check does not apply, so two members at one key on one side — such a substitute and its line, say — are published as two `member-removed` (or `member-added`) entries under one `entryId` rather than refused. On a baseline side no branch edit clears any of these: a baseline cannot be edited. One parent item rendering at two revisions is not one of them |
        | `CYCLE_DETECTED` | a cycle in the eBOM beneath either side's root, so that side cannot be resolved at all |

        Both sides are resolved, so either can raise either code. `AMBIGUOUS_CORRELATION`'s detail
        names the offending side in the **comparison's** own vocabulary — `left side`,
        `right side`, or `right and left sides` — where a pull's says `current` and `candidate`.
        The label before it is shared with pull-preview; switch on `code`, and read the ids rather
        than the nouns.

        A comparison always reports a cycle as **`CYCLE_DETECTED`**, never as the traversal's own
        `EBOM_CYCLE`: the two mean the same thing to a caller and are both 422, and carrying the
        inner code out would make this contract depend on which internal walk happened to find it.
        A tree read, which has one walk and no such choice, still answers `EBOM_CYCLE`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            ambiguous:
              value:
                code: AMBIGUOUS_CORRELATION
                message: "Several BOM lines share one position (the same parent, child and secondary unique key), so this pull or comparison cannot tell which line corresponds to which. If two BOM lines are genuine duplicates, give one its own secondary unique key. If this branch's own changes are among them, such as a substitute beside another line of the same part, exclude the substitute first, or in a pull revert your claim on that other line; otherwise remove or revert one of your changes at that position. A baseline cannot be edited, so these remedies apply only to the live branch. (left side: parent item a02g8000000Ab01EAC, child item a02g8000000Ab20EAC, secondary unique key (none); edges a0Bg8000000Ab10EAC and a0Bg8000000Ab19EAC, both under parent revision a0Ag8000000Ab01EAC)"
            cycle:
              value:
                code: CYCLE_DETECTED
                message: 'This change would make the child an ancestor of its own parent, which no BOM can represent. (beneath Assy-100 rev-2 at edge Harness-011)'

    InternalError:
      description: |
        500. Unhandled server-side failure. The body carries `INTERNAL_ERROR` plus the error type
        only — never its message or the stack trace. Never answered as a 200.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RestError' }
          examples:
            unexpected:
              value:
                code: INTERNAL_ERROR
                message: 'System.NullPointerException'

  # ---------------------------------------------------------------- examples

  examples:

