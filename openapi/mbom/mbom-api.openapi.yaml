            findNumber: 20
            childRows: []
          - edgeId: a1Eg8000000AbD3EAK
            edgeKey: a0Bg8000000Ab12EAC
            parentItemId: a02g8000000Ab01EAC
            childItemId: a02g8000000Ab22EAC
            childItemRevisionId: a0Ag8000000Ab61EAC
            provenance: claimed
            governingTimestamp: '2026-01-15T00:00:00.000Z'
            sourceId: a1Cg8000000AbCeEAK
