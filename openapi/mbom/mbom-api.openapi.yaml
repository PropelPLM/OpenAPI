    BranchTreeNested:
      value:
        asOf: '2026-04-05T17:22:03.518Z'
        rootRevisionId: a0Ag8000000Ab01EAC
        sourceTimePoint: '2026-01-15T00:00:00.000Z'
        rows:
          - edgeId: null
            edgeKey: a0Bg8000000Ab14EAC
            parentItemId: a02g8000000Ab01EAC
            childItemId: a02g8000000Ab30EAC
            childItemRevisionId: a0Ag8000000Ab71EAC
            provenance: inherited
            governingTimestamp: '2026-01-15T00:00:00.000Z'
            sourceId: a1Cg8000000AbCeEAK
            isClaimed: false
            isExcluded: false
            isReplaced: false
            isEditable: true
            quantity: 1
            findNumber: 50
            childRows:
              - edgeId: null
                edgeKey: a0Bg8000000Ab15EAC
                parentItemId: a02g8000000Ab30EAC
                childItemId: a02g8000000Ab31EAC
                childItemRevisionId: a0Ag8000000Ab72EAC
                provenance: inherited
                governingTimestamp: '2026-01-15T00:00:00.000Z'
                sourceId: a1Cg8000000AbCeEAK
