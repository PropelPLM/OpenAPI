          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlattenedStructure' }
        '400':
          description: '`ASOF_INVALID`, `ASOF_IN_FUTURE` or `INVALID_REQUEST` — as on the branch flattened read.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundPath' }
        '413': { $ref: '#/components/responses/StructureTooLarge' }
        '422':
          description: '`EBOM_CYCLE` — the source eBOM contains a cycle.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mbom/baselines/{baselineId}/flattened:
    get:
      tags: [Baselines]
      operationId: getBaselineFlattened
      summary: Read the parts a baseline captured, flattened
      description: |
        The [flattened view](#operation/getBranchFlattened) of a baseline, re-resolved at the
        baseline's own timepoint — the flattened counterpart of the
        [baseline tree read](#operation/getBaselineTree). `asOf` is refused (`400 INVALID_REQUEST`)
        for the reason given there.
      parameters:
